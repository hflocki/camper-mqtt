<text x="560" y="900" font-size="14" text-anchor="start" fill="#333">• Gemeinsame Masse: alle Masse-Symbole sind verbunden (12-V-Minus, Modul, Wandler, ESP GND, RJ12 Pin 5).</text>
<text x="560" y="922" font-size="14" text-anchor="start" fill="#333">• Vor dem ersten Anschluss: Polarität am JST messen, Master-Widerstand am Modul prüfen, RX am Modul ≤ 3,3 V.</text>
<text x="560" y="944" font-size="14" text-anchor="start" fill="#333">• Firmware: BOARD_ESP32C3_SUPERMINI (TX = GPIO4, RX = GPIO3). Kreuzungen ohne Punkt: nicht verbunden.</text>
