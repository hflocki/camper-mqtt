; RoadBuddy - PlatformIO project
; The sources are shared with the Arduino IDE variant in ../_arduino/roadbuddy,
; so there is only one code base (and one config.h) to maintain.

[platformio]
src_dir = ../_arduino/roadbuddy

[env:roadbuddy]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    m5stack/M5Unified
    knolleary/PubSubClient
    bblanchon/ArduinoJson @ ^7.4
