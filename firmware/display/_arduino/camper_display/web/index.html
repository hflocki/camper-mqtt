<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Camper Display</title>
<style>
:root{--bg:#0f1419;--card:#1b232b;--hi:#26313b;--tx:#e8edf2;--mu:#8696a6;--water:#3ba3e8;--grey:#a88b6a;--gas:#f0a030;--heat:#f06a3b;--ok:#4cc27a;--warn:#e5484d;--ac:#5ab0f0}
@media (prefers-color-scheme:light){:root{--bg:#eef1f4;--card:#fff;--hi:#e3e8ee;--tx:#14202b;--mu:#5d6d7c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--card);padding:10px 14px 0;box-shadow:0 1px 0 #0003}
.top{display:flex;align-items:center;gap:10px;position:relative}
.top h1{font-size:18px;margin:0;flex:1}
#clock{font-variant-numeric:tabular-nums;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);display:inline-block}
.dot.ok{background:var(--ok)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--hi);color:var(--tx);font:inherit;font-size:15px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
#menu{display:none;border:0;background:var(--hi);color:var(--tx);border-radius:10px;font-size:20px;line-height:1;padding:6px 10px;cursor:pointer}
@media (max-width:640px){#menu{display:block}nav{display:none;flex-direction:column;gap:4px;padding:8px 0 12px;max-height:70vh;overflow-y:auto}
 header.open nav{display:flex}nav button{text-align:left;border-radius:12px;padding:12px 14px}#dname{display:none}}
main{padding:14px;max-width:820px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border-radius:16px;padding:14px;position:relative}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 6px;font-size:14px;font-weight:500;color:var(--mu)}
.big{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.huge{font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.mu{color:var(--mu);font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--hi);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;transition:width .4s}
.click{cursor:pointer}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .grow{flex:1}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--hi);color:var(--tx);font:inherit;cursor:pointer;min-width:52px}
.btn:active{filter:brightness(1.25)}
.btn.on{background:var(--heat);color:#fff}
.btn.pri{background:var(--ac);color:#fff}
.btn.danger{background:var(--warn);color:#fff}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:9px}
.seg{display:inline-flex;gap:6px}
.seg .btn.on{background:var(--heat)}
.offline{opacity:.45}
input[type=range]{width:100%;accent-color:var(--ac)}
.err{color:var(--warn)}
.okc{color:var(--ok)}
.card.alarm{background:var(--warn);color:#fff}.card.alarm h3{color:#fff}
.hist{margin-top:12px}.hist svg{width:100%;height:auto;display:block}.hist .lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px;color:var(--mu)}.hist .lg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.fanbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fanbtns .btn{padding:18px}
svg text{fill:var(--tx);font:13px system-ui}
/* settings */
details{background:var(--card);border-radius:14px;margin-bottom:12px;padding:0 14px}
summary{cursor:pointer;padding:14px 0;font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--hi);background:var(--bg);color:var(--tx);font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--tx);font-size:15px}
.chk input{width:20px;height:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0}
.sgroups{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sgroups .btn.on{background:var(--ac);color:#fff}
.savebar{position:sticky;bottom:0;display:flex;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg);z-index:4}
.tileed{border:1px solid var(--hi);border-radius:12px;padding:10px;margin:10px 0}
.tileed .row b{flex:1}
details.sn{background:none;margin:8px 0;padding:8px 10px}details.sn>summary{padding:4px 0;gap:8px;list-style:none;font-weight:400}details.sn>summary::-webkit-details-marker{display:none}details.sn[open]>summary{margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 4px;border-top:1px solid var(--hi);vertical-align:top;word-break:break-all}
code{font-size:12px;color:var(--mu)}
.chip{display:inline-block;margin:2px;padding:3px 8px;border-radius:8px;background:var(--hi);cursor:pointer;font-size:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.banner{background:var(--gas);color:#000;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.warnbox{background:var(--warn);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:600;white-space:pre-line}
.trow{display:flex;align-items:center;gap:10px}
.trow .n{flex:1;color:var(--mu);font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.al .big{color:var(--warn)}
</style>
</head>
<body>
<header>
  <div class="top"><button id="menu" aria-label="Menü" title="Menü">☰</button><span class="dot" id="dot" title="Verbindung"></span><h1 id="title">Camper</h1><span class="mu" id="dname" style="position:absolute;left:50%;transform:translateX(-50%);font-weight:600;pointer-events:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="btn" id="wake" hidden title="Display ist dunkel" style="padding:6px 12px;font-size:14px">💡 Display an</button><button class="btn" id="sleep" hidden title="Display ausschalten" style="padding:6px 10px;font-size:14px">💤</button><span id="clock"></span></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ws,cfg=null,V={},S={},WX={},page=localStorage.getItem('page')||'',finder={on:false,l:{}};
let pendingSet=null,setTimer=null,setHold=0;
const BUILTIN=[['overview','Home'],['heater','Truma'],['fan','MaxxFan'],['level','Level'],['temp','Temperatur'],['bat','Batterie'],['weather','Wetter'],['actors','Aktoren'],['warn','Warnungen'],['light','Licht']];
const NAV_FREE=6;   // icon bar on the panel: Home + 6 chosen pages + System
// page title: name from the display settings, otherwise the default above
const ptitle=i=>(cfg&&cfg.pageNames&&cfg.pageNames[i])||BUILTIN[i][1];
// overview tiles (same list as on the panel)
const OV_DEFAULT='water,grey,gas,heater,level,fan,temp,bat,status';
const ovList=()=>((cfg&&cfg.ovTiles)||OV_DEFAULT).split(',').map(x=>x.trim()).filter(x=>x);
function ovChoices(){
  const c=[['water','Frischwasser'],['grey','Grauwasser'],['gas','Gas'],['heater',ptitle(1)],['level',ptitle(3)],['fan',ptitle(2)],
    ['temp',ptitle(4)],['bat',ptitle(5)+' (alle)'],['bat1','Batterie 1 (einzeln)'],['bat2','Batterie 2 (einzeln)'],['bat3','Batterie 3 (einzeln)'],
    ['status','Status / Warnungen'],['weather',ptitle(6)],['actors',ptitle(7)+' (offene Fenster)'],['lights',ptitle(9)+' (was an ist)'],['clock','Uhr / Datum'],['none','(leer)']];
  ((cfg&&cfg.tiles)||[]).forEach((t,i)=>c.push(['t'+i,'Kachel: '+t.n]));
  return c;
}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function send(o){if(ws&&ws.readyState==1)ws.send(JSON.stringify(o));else toast('Keine Verbindung')}
function num(v,d){if(v===undefined||v==='')return null;const f=parseFloat(v);return isNaN(f)?null:(d===undefined?f:f.toFixed(d))}
function fmt(v,d,u){const n=num(v,d);if(n===null)return(v&&v!=='')?esc(v)+(u?' '+u:''):'--';return n+(u?' '+u:'')}
function online(dev){return V[dev+'_status']==='online'}

// ---------- connection ----------
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>$('#dot').classList.add('ok');
  ws.onclose=()=>{$('#dot').classList.remove('ok');setTimeout(connect,2000)};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='cfg'){cfg=m;buildNav();if(!pages().some(p=>p.id===page))page=cfg.setup?'settings':pages()[0].id;render()}
    else if(m.t==='v'){Object.assign(V,m.d||{});if(m.s)Object.assign(S,m.s);update()}
    else if(m.t==='f'){if(!m.add)finder.l={};if('on' in m)finder.on=!!m.on;else finder.on=true;finder.filter=m.filter;(m.l||[]).forEach(x=>finder.l[x[0]]=x[1]);renderFinder()}
    else if(m.t==='err')toast(m.msg);
    else if(m.t==='wx'){WX=m.w||{};update()}
  };
}

// ---------- pages ----------
function pages(){
  const p=[];if(!cfg)return p;
  BUILTIN.forEach((b,i)=>{if(cfg.builtin[i])p.push({id:b[0],title:ptitle(i)})});
  cfg.pages.forEach((n,i)=>p.push({id:'p'+i,title:n,custom:i}));
  p.push({id:'rules',title:'⚡ Automationen'});
  p.push({id:'links',title:'🔗 Geräte'});
  p.push({id:'settings',title:'⚙ Einstellungen'});
  return p;
}
function buildNav(){
  $('#nav').innerHTML=pages().map(p=>`<button data-p="${p.id}">${esc(p.title)}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.p;localStorage.setItem('page',page);document.querySelector('header').classList.remove('open');render()});
}
function render(){
  $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
  if($('#menu'))$('#menu').textContent='☰';
  const p=pages().find(x=>x.id===page);if(!p)return;
  $('#title').textContent=p.title.replace('⚙ ','');
  $('#dname').textContent=cfg.name||'';document.title=cfg.name?cfg.name+' · Camper Display':'Camper Display';
  const m=$('#main');
  if(p.id==='overview')m.innerHTML=pgOverview();
  else if(p.id==='heater')m.innerHTML=pgHeater();
  else if(p.id==='fan')m.innerHTML=pgFan();
  else if(p.id==='level')m.innerHTML=pgLevel();
  else if(p.id==='temp'){m.innerHTML=pgTemp();loadHist()}
  else if(p.id==='bat'){m.innerHTML=pgBat();loadHist()}
  else if(p.id==='weather')m.innerHTML=pgWeather();
  else if(p.id==='actors')m.innerHTML=pgActors();
  else if(p.id==='light')m.innerHTML=pgLight();
  else if(p.id==='warn')m.innerHTML=pgWarn();
  else if(p.id==='links')m.innerHTML=pgLinks();
  else if(p.id==='rules'){m.innerHTML=pgRules();loadRules()}
  else if(p.id==='settings'){m.innerHTML=pgSettings();loadSettings()}
  else m.innerHTML=pgCustom(p.custom);
  bind();update();
}

function tank(id,icon,title,col){return `<div class="card"><h3>${icon} ${title}</h3><div class="row"><span class="big grow" id="${id}_v">--</span><span class="mu" id="${id}_l"></span></div><div class="bar"><i id="${id}_b" style="background:${col}"></i></div></div>`}
function info(id,icon,title,go){return `<div class="card click" data-go="${go}"><h3>${icon} ${title}</h3><div class="big" id="${id}_v">--</div><div class="mu" id="${id}_s"></div></div>`}
function pgOverview(){
  const parts=ovList().map(t=>{
    if(t==='water')return tank('w','💧','Frischwasser','var(--water)');
    if(t==='grey')return tank('g','🚿','Grauwasser','var(--grey)');
    if(t==='gas')return tank('gas','🔥','Gas','var(--gas)');
    if(t==='heater')return info('oh','♨️',esc(ptitle(1)),'heater');
    if(t==='weather')return info('owx','🌦',esc(ptitle(6)),'weather');
    if(t==='level')return info('ol','📐',esc(ptitle(3)),'level');
    if(t==='fan')return info('of','🌀',esc(ptitle(2)),'fan');
    if(t==='temp')return `<div class="card wide click" data-go="temp"><h3>🌡️ ${esc(ptitle(4))}</h3><div class="big" id="ot_v" style="font-size:22px">--</div><div class="mu" id="ot_s"></div></div>`;
    if(t==='bat')return `<div class="card wide click" data-go="bat"><h3>🔋 ${esc(ptitle(5))}</h3><div class="big" id="ob_v" style="font-size:22px">--</div><div class="mu" id="ob_s"></div></div>`;
    if(/^bat[123]$/.test(t)){const n=t[3];return `<div class="card click" data-go="bat"><h3 id="ob${n}_t">🔋 Batterie ${n}</h3><div class="big" id="ob${n}_v">--</div><div class="mu" id="ob${n}_s"></div></div>`}
    if(/^t\d+$/.test(t)){const i=+t.slice(1),k=(cfg.tiles||[])[i];if(!k)return '';return `<div class="card"><h3>${esc(k.n)}</h3><div class="big" id="t${i}_v">--</div></div>`}
    if(t==='lights')return `<div class="card click" data-go="light"><h3>💡 ${esc(ptitle(9))}</h3><div class="big" id="ol_v" style="font-size:20px">--</div><div class="mu" id="ol_s"></div></div>`;
    if(t==='actors')return `<div class="card click" data-go="actors"><h3>🚪 ${esc(ptitle(7))}</h3><div class="big" id="oa_v" style="font-size:20px">--</div><div class="mu" id="oa_s"></div></div>`;
    if(t==='status')return `<div class="card click" id="ost" data-go="warn"><h3>⚠ Status</h3><div class="big" id="ost_v" style="white-space:pre-line">OK</div><div id="ost_i" style="font-size:22px;margin-top:4px"></div></div>`;
    return '';   // clock (header), none
  });
  // without a status tile the warnings appear in a box above the tiles
  const box=ovList().includes('status')?'':'<div class="warnbox" id="warn" hidden></div>';
  return `${box}<div class="grid">${parts.join('')}</div>`;
}
// windows / doors (own Zigbee contacts marked for this page) and all warnings
const contacts=()=>sens().filter(x=>x.k===0&&((x.sh??4)&4));
// lights with one of the given Show bits (4 = Aktoren, 16 = Licht)
const lightsOf=(bits)=>sens().map((x,i)=>Object.assign({di:i},x)).filter(x=>x.k===2&&((x.sh??16)&bits));
// same quick colours as on the panel: [key, value, shown colour, text]
const SWATCH=[['ct','370','#ffc27a','Warm'],['ct','153','#e6f0ff','Kalt'],['color','#ff0000','#ff2020',''],['color','#ff8000','#ff8a00',''],['color','#00ff00','#30d050',''],['color','#0040ff','#2f6bff',''],['color','#a000ff','#a040ff','']];
const LSIG={};
function pgLight(){LSIG.lp_list='';return `<div class="grid" id="lp_list"></div><div class="mu" id="lp_st" style="margin-top:12px"></div>`}
function pgActors(){LSIG.l_list='';return `<div class="grid" id="l_list"></div><div class="grid" id="a_list" style="margin-top:12px"></div><div class="mu" id="a_st" style="margin-top:12px"></div>`}
// light cards are built once per light list, then only their state is updated (sliders keep working)
function updLights(id,bits){
  const box=$('#'+id);if(!box)return;const ls=lightsOf(bits);
  const sig=ls.map(l=>l.di+l.n).join('|');
  if(sig!==LSIG[id]){LSIG[id]=sig;
    box.innerHTML=ls.map(l=>`<div class="card wide" data-ld="${l.di}"><div class="row"><h3 class="grow" style="margin:0;font-size:17px;color:var(--tx)">💡 ${esc(l.n)}</h3><button class="btn" data-lon="${l.di}">⏻</button></div>
      <div class="row" style="margin-top:10px"><input type="range" min="1" max="254" class="grow" data-llv="${l.di}"><span class="mu" style="min-width:48px;text-align:right" data-llt="${l.di}"></span></div>
      <div class="row" style="gap:6px;margin-top:10px">${SWATCH.map(w=>`<button class="btn sm" data-lsw="${l.di}" data-k="${w[0]}" data-v="${w[1]}" style="background:${w[2]};color:#1a1f24;min-width:44px">${w[3]||'&nbsp;'}</button>`).join('')}
       <input type="color" data-lcol="${l.di}" value="#ffffff" title="Eigene Farbe" style="width:48px;height:36px;border:0;background:none;padding:0"></div></div>`).join('');
    box.querySelectorAll('[data-lon]').forEach(e=>e.onclick=()=>send({c:'light',i:+e.dataset.lon,k:'on',v:'TOGGLE'}));
    box.querySelectorAll('[data-llv]').forEach(e=>{e.oninput=()=>box.querySelector(`[data-llt="${e.dataset.llv}"]`).textContent=Math.round(e.value*100/254)+' %';
      e.onchange=()=>send({c:'light',i:+e.dataset.llv,k:'level',v:e.value})});
    box.querySelectorAll('[data-lsw]').forEach(e=>e.onclick=()=>send({c:'light',i:+e.dataset.lsw,k:e.dataset.k,v:e.dataset.v}));
    box.querySelectorAll('[data-lcol]').forEach(e=>e.onchange=()=>send({c:'light',i:+e.dataset.lcol,k:'color',v:e.value}));
  }
  ls.forEach(l=>{const c=box.querySelector(`[data-ld="${l.di}"]`);if(!c)return;
    const b=c.querySelector('[data-lon]');b.classList.toggle('on',l.o===1);b.textContent=l.o===1?'⏻ An':l.o===0?'⏻ Aus':'⏻ ?';
    const r=c.querySelector('[data-llv]');if(l.lv!=null&&document.activeElement!==r){r.value=l.lv;c.querySelector('[data-llt]').textContent=Math.round(l.lv*100/254)+' %'}
    r.style.opacity=l.o===1?1:.5;
    const cp=c.querySelector('[data-lcol]');if(l.col&&l.col[0]==='#'&&document.activeElement!==cp)cp.value=l.col;
    c.classList.toggle('offline',l.age<0||l.age>7200)});
}
function pgWarn(){return `<div class="card" id="wn_box"><div id="wn_l" style="white-space:pre-line;font-size:18px;font-weight:600">--</div></div>`}
// Links to the web pages of the other devices (Einstellungen -> Geräte-Links)
function pgLinks(){
  const l=(cfg&&cfg.links)||[];
  if(!l.length)return `<div class="card mu">Noch keine Geräte-Links. Unter ⚙ Einstellungen → 🔗 Geräte-Links eintragen.</div>`;
  return `<div class="grid">${l.map(x=>`<a class="card click" href="${esc(x.u)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><h3>🔗 ${esc(x.u.replace(/^https?:\/\//,'').replace(/\/$/,''))}</h3><div class="big" style="font-size:20px">${esc(x.n)}</div><div class="mu">Konfiguration öffnen ↗</div></a>`).join('')}</div>`;
}
// ---------- weather (Open-Meteo via the display) ----------
const WXI=(c,day)=>c===0?(day?'☀️':'🌙'):c<=2?(day?'⛅':'☁️'):c===3?'☁️':c<=48?'🌫':c<=67?'🌧':c<=77?'❄️':c<=82?'🌦':c<=86?'🌨':'⛈';
const WDAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const n0=v=>v==null||isNaN(v)?'--':Math.round(v);
const n1=v=>v==null||isNaN(v)?'--':cnum(v,1);
function pgWeather(){
  const sm=(id,t)=>`<div class="card"><h3>${t}</h3><div class="row"><span class="big grow" style="white-space:nowrap" id="${id}_v">--</span><span class="mu" style="white-space:nowrap" id="${id}_s"></span></div></div>`;
  return `<div class="grid"><div class="card wide"><div class="row"><span style="font-size:56px;line-height:1" id="x_i"></span><span class="huge grow" id="x_t" style="margin-left:12px">--</span>
   <div style="text-align:right"><div class="big" id="x_txt" style="font-size:22px"></div><div class="mu" id="x_f"></div><div class="mu" id="x_p"></div></div></div></div>
   <div class="card"><h3>📍 Standort</h3><div class="big" id="x_l_v" style="font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">--</div><div class="mu" id="x_l_c" style="white-space:nowrap"></div><div class="mu" id="x_l_s"></div></div>
   <div class="card wide" id="x_o" hidden><div class="row"><span class="mu grow" id="x_o_n">🌡️ Außen (Sensor)</span><span class="big" id="x_o_v">--</span><span class="mu" id="x_o_h"></span></div></div>
   ${sm('x_w','💨 Wind')}${sm('x_h','💧 Luftfeuchte')}${sm('x_n','☂️ Nächste Stunde')}${sm('x_r','☂️ Regen heute')}

function drawHist(){
  if(!HIST)return;
  [['h_t','t','°C'],['h_b','b','%'],['h_v','v','V']].forEach(([id,k,unit])=>{
    const box=$('#'+id);if(!box)return;
    const ss=HIST.s.filter(s=>s.k===k&&s.v.some(x=>x!=null)).map((s,i)=>Object.assign({c:HCOL[i%HCOL.length]},s));
    box.hidden=!ss.length||HIST.n<2;if(box.hidden)return;
    const all=ss.flatMap(s=>s.v.filter(x=>x!=null));
    let lo=Math.min(...all),hi=Math.max(...all);
    if(k==='b'){lo=0;hi=100}else{const pad=Math.max((hi-lo)*0.1,k==='v'?0.1:0.5);lo=Math.floor((lo-pad)*2)/2;hi=Math.ceil((hi+pad)*2)/2}
    const W=600,H=200,L=40,R=8,T=8,B=22,N=HIST.n,step=HIST.step||300;
    const X=i=>L+(W-L-R)*(N<2?0:i/(N-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo||1));
    let g='';
    for(let j=0;j<=4;j++){const v=lo+(hi-lo)*j/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--hi)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mu)">${(Math.round(v*10)/10).toString().replace('.',',')}</text>`}
    // x axis: hours back from the newest sample (clock time if known)
    const span=(N-1)*step,last=HIST.last||0;
    for(let h=0;h*3600<=span;h+=span>43200?6:span>10800?3:1){const i=N-1-h*3600/step;if(i<0)break;
      const lbl=last?new Date((last-h*3600)*1000).toTimeString().slice(0,5):(h?'-'+h+' h':'jetzt');
      g+=`<text x="${X(i)}" y="${H-6}" text-anchor="${h?"middle":"end"}" font-size="11" fill="var(--mu)">${lbl}</text>`}
    const lines=ss.map(s=>{let d='',pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true});
      return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`}).join('');
    const lastV=s=>{for(let i=s.v.length-1;i>=0;i--)if(s.v[i]!=null)return s.v[i];return null};
    box.querySelector('.hc').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">${g}${lines}</svg>

  });
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{if(pages().some(p=>p.id===e.dataset.go)){page=e.dataset.go;render()}});
  document.querySelectorAll('[data-hk]').forEach(e=>e.onclick=()=>send({c:'heat',k:e.dataset.hk,v:e.dataset.hv}));
  const pow=$('#h_pow');if(pow)pow.onclick=()=>send({c:'heat',k:'hvac_mode',v:V.heat_hvac==='heat'?'off':'heat'});
  const dec=$('#h_dec');if(dec)dec.onclick=()=>{const on=V.heat_decoke==='ON';if(on||confirm('Freibrennen starten?'))send({c:'heat',k:'decoke',v:on?'OFF':'ON'})};
  document.querySelectorAll('[data-set]').forEach(e=>e.onclick=()=>{
    const base=pendingSet??Math.round(num(V.heat_set)??20);pendingSet=Math.max(5,Math.min(30,base+ +e.dataset.set));
    $('#h_set').textContent=pendingSet+' °C';clearTimeout(setTimer);
    setTimer=setTimeout(()=>{send({c:'heat',k:'room_setpoint',v:String(pendingSet)});setHold=Date.now()+6000;setTimer=null},1000)});
  document.querySelectorAll('[data-fan]').forEach(e=>e.onclick=()=>send({c:'fan',k:e.dataset.fan}));
  const sp=$('#f_speed');if(sp){sp.oninput=()=>$('#f_sv').textContent=sp.value;sp.onchange=()=>send({c:'fan',k:'speed',v:sp.value})}
  document.querySelectorAll('[data-lvl]').forEach(e=>e.onclick=()=>{if(confirm('Aktuelle Lage als eben speichern (Tara)?'))send({c:'lvl',k:e.dataset.lvl})});
  document.querySelectorAll('[data-tile]').forEach(e=>e.onclick=()=>send({c:'tile',i:+e.dataset.tile,v:e.dataset.a}));
  document.querySelectorAll('[data-slider]').forEach(e=>{e.oninput=()=>{const t=cfg.tiles[+e.dataset.slider];$('#t'+e.dataset.slider+'_v').textContent=e.value+(t.u?' '+t.u:'')};

}

// settings groups: [id, label]; the chosen one is remembered in the browser
const SET_GROUPS=[['view','🖥 Anzeige'],['dev','📡 Sensoren & Geräte'],['net','🔌 Verbindung'],['svc','🌦 Dienste'],['sys','🔧 System']];
let setGroup=(()=>{try{return localStorage.getItem('setGroup')||'view'}catch(e){return'view'}})();
function showGroup(g){setGroup=g;try{localStorage.setItem('setGroup',g)}catch(e){}
  document.querySelectorAll('[data-sg]').forEach(b=>b.classList.toggle('on',b.dataset.sg===g));
  document.querySelectorAll('#sets>details').forEach(d=>d.hidden=d.dataset.g!==g);
  const sd=$('#snd');if(g==='dev'&&sd&&!sd.open){sd.open=true}}
const FIELDS=['wifiSsid','wifiPass','ip','gateway','subnet','dns','mqttHost','mqttPort','mqttUser','mqttPass','prefixTank','prefixLevel','prefixHeater','prefixFan','prefixTemp','prefixBattery','prefixSelf','dimBrightness','screenTimeout','displayName','hostname','apPass','webUser','webPass','ntpServer','tz','poToken','poUser','poTitle','wxLat','wxLon','wxName','wxTopic','wxGust'];
async function loadSettings(){
  try{
    const r=await fetch('/api/settings');if(!r.ok)throw 0;ST=await r.json();
    FIELDS.forEach(f=>{const e=document.getElementById(f);if(e)e.value=ST[f]??''});
    $('#staticIp').checked=ST.staticIp;$('#fanPort').value=ST.fanPort;$('#brightness').value=ST.brightness;
    $('#heaterSrc').value=String(ST.heaterSrc||0);renderNavSel();
    BUILTIN.forEach((b,i)=>$('#bp'+i).checked=ST.builtin[i]);
    for(let i=0;i<=BUILTIN.length;i++){const e=$('#pn'+i);if(e)e.value=(ST.pageNames||[])[i]||''}
    {const l=(ST.ovTiles||OV_DEFAULT).split(',');for(let i=0;i<9;i++){const e=$('#ov'+i);if(e)e.value=l[i]||'none'}}
    LINKS=(ST.links||[]).map(x=>({n:x.n,u:x.u}));renderLinks();
    $('#warnWake').checked=!!ST.warnWake;$('#wxOn').checked=!!ST.wxOn;$('#wxEvery').value=String(ST.wxEvery||60);
    $('#slt').innerHTML=$('#slb').innerHTML='';renderSlots();
    $('#poOn').checked=!!ST.poOn;$('#poClear').checked=ST.poClear!==false;$('#poPrio').value=String(ST.poPrio||0);
    $('#postat').textContent=ST.poStatus?'Zuletzt: '+ST.poStatus:'';
    $('#sysinfo').textContent=`Firmware ${ST.fw} · MAC ${ST.mac} · IP ${S.ip||''}`;
    const p=await fetch('/api/pages');PG=await p.json();PG.pages=PG.pages||[];PG.tiles=PG.tiles||[];renderPages();
  }catch(e){toast('Einstellungen konnten nicht geladen werden')}
  $('#save').onclick=saveSettings;
  document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>showGroup(b.dataset.sg));
  if(cfg&&cfg.setup){let had=null;try{had=localStorage.getItem('setGroup')}catch(e){}if(!had)setGroup='net'}
  showGroup(SET_GROUPS.some(x=>x[0]===setGroup)?setGroup:'view');
  $('#lnkadd').onclick=()=>{readLinks();LINKS.push({n:'',u:''});renderLinks()};
  $('#lnksug').onclick=()=>{readLinks();SUGGEST.forEach(([n,h])=>{if(!LINKS.some(x=>x.u.includes(h)||x.n.toLowerCase()===n.toLowerCase()))LINKS.push({n,u:'http://'+h+'.local/'})});renderLinks()};
  $('#brightness').oninput=e=>send({c:'bri',v:e.target.value});
  $('#scan').onclick=scan;
  $('#wxsearch').onclick=wxSearch;$('#wxq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();wxSearch()}};
  $('#reboot').onclick=()=>{if(confirm('Neu starten?'))post('/api/reboot')};
  $('#factory').onclick=()=>{if(confirm('Alle Einstellungen löschen?'))post('/api/factory')};
  $('#fwup').onclick=upload;
  $('#bkexp').onclick=backupExport;$('#bkimp').onclick=backupImport;
  $('#potest').onclick=async()=>{await post('/api/pushover/test');setTimeout(async()=>{try{const r=await fetch('/api/settings');const s=await r.json();$('#postat').textContent=s.poStatus?'Zuletzt: '+s.poStatus:''}catch(e){}},6000)};
  $('#fstart').onclick=()=>send({c:'finder',on:!finder.on,f:$('#ffilter').value});
  renderFinder();
}
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):'{}'});
  let j={};try{j=await r.json()}catch(e){}
  toast(j.msg||(r.ok?'OK':'Fehler'));
  if(j.reboot)setTimeout(()=>location.reload(),8000);
  return r.ok;
}
// ---- device links editor ----
let LINKS=[];
const SUGGEST=[['Tanklevel','camper-tanklevel'],['Temperatur','camper-temp'],['Truma','truma-heater'],['MaxxFan','camper-maxxfan'],['Level','camper-level'],['Batterie','camper-battery']];
function renderLinks(){
  const b=$('#lnk');if(!b)return;
  b.innerHTML=LINKS.map((x,i)=>`<div class="row" style="gap:6px;margin:4px 0"><input type="text" data-ln="${i}" value="${esc(x.n)}" placeholder="Name" maxlength="24" style="flex:1;min-width:0"><input type="text" data-lu="${i}" value="${esc(x.u)}" placeholder="http://192.168.8.13/" maxlength="120" style="flex:2;min-width:0"><button class="btn" type="button" data-ld="${i}" title="Entfernen">✕</button></div>`).join('')||'<p class="mu">Noch keine Links.</p>';
  b.querySelectorAll('[data-ld]').forEach(e=>e.onclick=()=>{readLinks();LINKS.splice(+e.dataset.ld,1);renderLinks()});
}
function readLinks(){
  document.querySelectorAll('[data-ln]').forEach(e=>{const i=+e.dataset.ln;if(LINKS[i])LINKS[i].n=e.value.trim()});
  document.querySelectorAll('[data-lu]').forEach(e=>{const i=+e.dataset.lu;if(LINKS[i])LINKS[i].u=e.value.trim()});
}
// three rows per tile: sensor/battery + icon; names from the live data and the saved choice
function renderSlots(){
  [['slt',true],['slb',false]].forEach(([id,temp])=>{
    const box=$('#'+id);if(!box)return;
    const N=temp?SLOTS_T:SLOTS_B,rows=[...Array(N).keys()];
    let cur=slotsOf(ST&&(temp?ST.ovTempSel:ST.ovBatSel),N);
    if(box.querySelector('[data-sn]'))cur=rows.map(i=>({n:box.querySelector(`[data-sn="${i}"]`).value,k:box.querySelector(`[data-sk="${i}"]`).value}));
    // temperatures: also own sensors that sent nothing yet
    const live=temp?allTemps().map(x=>x.name).concat(sens().filter(x=>x.k===1&&((x.sh??1)&1)).map(x=>x.n)):bats().map(x=>x.name);
    const names=[...new Set([...live,...cur.map(x=>x.n)].filter(x=>x))];
    box.innerHTML=rows.map(i=>{const c=cur[i]||{n:'',k:''};
      return `<div class="row" style="gap:8px;margin:4px 0;flex-wrap:nowrap"><select data-sn="${i}" style="flex:1;min-width:0"><option value="">– leer –</option>${names.map(n=>`<option value="${esc(n)}"${n===c.n?' selected':''}>${esc(n)}</option>`).join('')}</select><select data-sk="${i}" style="flex:1;min-width:0"><option value="">Symbol automatisch</option>${ICONS.map(x=>`<option value="${x[0]}"${x[0]===c.k?' selected':''}>${x[1]} ${x[2]}</option>`).join('')}</select></div>`}).join('');
  });
}
function readSlots(id,n){const b=$('#'+id);if(!b)return'';const l=[];for(let i=0;i<n;i++){const n=b.querySelector(`[data-sn="${i}"]`).value;if(n)l.push(n+'='+b.querySelector(`[data-sk="${i}"]`).value)}return l.join('\n')}
// icon bar of the panel: NAV_FREE selects with all pages except Home (System is fixed)
function renderNavSel(){
  const b=$('#navsel');if(!b)return;
  const opts=BUILTIN.map((x,i)=>[x[0],ptitle(i)]).slice(1).concat(((cfg&&cfg.pages)||[]).map((n,i)=>['p'+i,n]));
  const cur=(ST.navSel||'').split(',').filter(x=>x);
  b.innerHTML=[...Array(NAV_FREE).keys()].map(i=>`<select id="nv${i}" style="padding:8px 4px;font-size:13px"><option value="">–</option>${opts.map(o=>`<option value="${o[0]}"${cur[i]===o[0]?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`).join('');
}
// ---- own sensors (/api/sensors)
let SN={devices:[]};
async function loadSensors(){
  try{const r=await fetch('/api/sensors');if(r.ok)SN=await r.json()}catch(e){}
  ['zbBase','bleBase'].forEach(k=>$('#'+k).value=SN[k]||'');$('#tempDiv').value=String(SN.tempDiv||10);$('#humDiv').value=String(SN.humDiv||1);
  renderSensors();loadUnknown();
  $('#snadd').onclick=()=>{readSensors();SN.devices.push({name:'',bus:0,kind:1,addr:'',alt:'',icon:'door',warn:false,invert:false,show:1});renderSensors()};
  $('#snsave').onclick=async()=>{readSensors();if(await post('/api/sensors',SN))setTimeout(loadUnknown,1500)};
  $('#snfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(x){return toast('Keine gültige JSON-Datei')}
    readSensors();let n=0;
    (j.zigbee_devices||[]).forEach(d=>{SN.devices.push({name:d.name||'',bus:0,kind:d.isWeatherSensor?1:0,addr:d.ieeeAddr||d.shortId||'',alt:d.ieeeAddr&&d.shortId?d.shortId:'',icon:'door',warn:false,invert:false,show:d.isWeatherSensor?1:4});n++});
    (j.ble_devices||[]).forEach(d=>{SN.devices.push({name:d.name||'',bus:1,kind:1,addr:d.mac||'',icon:'',warn:false,show:1});n++});
    if(Array.isArray(j.devices))j.devices.forEach(d=>{SN.devices.push(d);n++});
    renderSensors();toast(n+' Sensoren übernommen – noch speichern');e.target.value=''};
}
// pages a sensor is shown on (bits as in sensors.h); third value: only for this kind (-1 = all)
const SHOW=[[1,'🌡️ Temperatur',[1]],[2,'🔋 Batterie',[0,1]],[16,'💡 Licht',[2]],[4,'🚪 Aktoren',[0,2]],[8,'🌦 Wetter (Außen)',[1]]];
const shOf=d=>d.show??(d.kind==1?1:d.kind==2?16:4);
const SN_OPEN=new Set();   // sensors unfolded in the editor (kept while re-rendering)

    const val=!v?'':v.k===2?(v.o===1?'an':v.o===0?'aus':'–'):v.k===0?(v.o===1?'offen':v.o===0?'zu':'–'):(v.t!=null?String(v.t).replace('.',',')+' °C':'–')+(v.h!=null?' · '+v.h+' %':'');
    const ty=d.bus==1?'📶':d.kind==0?'🚪':d.kind==2?'💡':'🌡️';
    return `<details class="tileed sn"${!d.name||!d.addr||SN_OPEN.has(i)?' open':''} data-si="${i}"><summary class="row"><span>${ty}</span><b class="grow">${esc(d.name||'Neuer Sensor')}</b><span class="mu">${esc(val)}${v&&v.age>=0?' · vor '+(v.age<120?v.age+' s':Math.round(v.age/60)+' min'):''}</span><button class="btn sm danger" data-sd="${i}" title="Entfernen">✕</button></summary>
    <div class="f2"><div><label>Name</label><input type="text" data-s="${i}" data-sf="name" value="${esc(d.name)}" placeholder="z. B. Heki"></div>
     <div><label>Funk / Typ</label><select data-s="${i}" data-sf="type"><option value="0-0"${d.bus==0&&d.kind==0?' selected':''}>Zigbee · Tür-/Fensterkontakt</option><option value="0-1"${d.bus==0&&d.kind==1?' selected':''}>Zigbee · Klima (Temp./Feuchte)</option><option value="0-2"${d.bus==0&&d.kind==2?' selected':''}>Zigbee · Licht / LED-Leiste</option><option value="1-1"${d.bus==1?' selected':''}>Bluetooth · Klima (Govee, Ruuvi …)</option></select></div>
     <div><label>${d.bus==1?'MAC-Adresse':d.kind==2?'IEEE-Adresse (zum Schalten nötig)':'Adresse (IEEE oder Short-ID)'}</label><input type="text" data-s="${i}" data-sf="addr" value="${esc(d.addr)}" placeholder="${d.bus==1?'A4C138AEF56D':'0x00158d… oder 9c68'}"></div>
     ${d.bus==0?`<div><label>Zweite Adresse (optional)</label><input type="text" data-s="${i}" data-sf="alt" value="${esc(d.alt||'')}" placeholder="Short-ID"></div>`:'<div></div>'}
     ${d.kind==0?`<div><label>Symbol, wenn offen</label><select data-s="${i}" data-sf="icon"><option value="">kein Symbol</option>${ICONS.map(x=>`<option value="${x[0]}"${d.icon===x[0]?' selected':''}>${x[1]} ${x[2]}</option>`).join('')}</select></div>
     <div><label class="chk"><input type="checkbox" data-s="${i}" data-sf="warn" ${d.warn?'checked':''}> Warnung, wenn offen</label><label class="chk"><input type="checkbox" data-s="${i}" data-sf="invert" ${d.invert?'checked':''}> umgekehrt (1 = zu)</label></div>`:''}</div>
    <label>Anzeigen auf</label><div class="row" style="gap:4px 14px">${SHOW.filter(x=>x[2].includes(+d.kind)).map(([bit,t])=>`<label class="chk" style="margin:2px 0"><input type="checkbox" data-s="${i}" data-sh="${bit}" ${(shOf(d)&bit)?'checked':''}> ${t}</label>`).join('')}</div></details>`}).join('')||'<p class="mu">Noch keine Sensoren.</p>';
  b.querySelectorAll('details.sn').forEach(e=>e.ontoggle=()=>{const i=+e.dataset.si;if(e.open)SN_OPEN.add(i);else SN_OPEN.delete(i)});
  b.querySelectorAll('[data-sf="type"]').forEach(e=>e.onchange=()=>{readSensors();renderSensors()});
  b.querySelectorAll('[data-sd]').forEach(e=>e.onclick=ev=>{ev.preventDefault();if(!confirm('Sensor entfernen?'))return;SN_OPEN.clear();readSensors();SN.devices.splice(+e.dataset.sd,1);renderSensors()});
}
function readSensors(){
  ['zbBase','bleBase'].forEach(k=>{const e=$('#'+k);if(e)SN[k]=e.value.trim()});
  if($('#tempDiv'))SN.tempDiv=+$('#tempDiv').value;if($('#humDiv'))SN.humDiv=+$('#humDiv').value;
  document.querySelectorAll('[data-sf]').forEach(e=>{const d=SN.devices[+e.dataset.s];if(!d)return;const f=e.dataset.sf;
    if(f==='type'){const [bus,kind]=e.value.split('-').map(Number);if(d.kind!==kind)d.show=kind==1?1:kind==2?16:4;d.bus=bus;d.kind=kind}else d[f]=e.type==='checkbox'?e.checked:e.value.trim()});
  SN.devices.forEach((d,i)=>{const boxes=document.querySelectorAll(`[data-s="${i}"][data-sh]`);if(!boxes.length)return;
    let m=0;boxes.forEach(b=>{if(b.checked)m|=+b.dataset.sh});d.show=m});
}
async function loadUnknown(){
  const b=$('#snnew');if(!b)return;
  let a=[];try{a=await (await fetch('/api/sensors/unknown')).json()}catch(e){}
  b.innerHTML=a.length?`<label>Gefunden, aber noch nicht eingetragen</label>${a.map(u=>`<div class="row" style="margin:4px 0"><span class="grow">${u.bus?'Bluetooth':'Zigbee'} · <code>${esc(u.addr)}</code> <span class="mu">vor ${u.ago<120?u.ago+' s':Math.round(u.ago/60)+' min'}</span></span><button class="btn sm" type="button" data-su="${u.bus}|${esc(u.addr)}">+ übernehmen</button></div>`).join('')}`:'';
  b.querySelectorAll('[data-su]').forEach(e=>e.onclick=()=>{readSensors();const [bus,addr]=e.dataset.su.split('|');SN.devices.push({name:'',bus:+bus,kind:1,addr,alt:'',icon:'door',warn:false,invert:false,show:1});renderSensors()});
}
function saveSettings(){
  const o={};FIELDS.forEach(f=>{const e=document.getElementById(f);if(e)o[f]=e.value});
  ['mqttPort','dimBrightness','screenTimeout','wxGust'].forEach(f=>o[f]=parseInt(o[f])||0);
  o.warnWake=$('#warnWake').checked;o.wxOn=$('#wxOn').checked;o.wxEvery=+$('#wxEvery').value;
  o.ovTempSel=readSlots('slt',SLOTS_T);o.ovBatSel=readSlots('slb',SLOTS_B);
  o.heaterSrc=+$('#heaterSrc').value;
  o.navSel=[...Array(NAV_FREE).keys()].map(i=>$('#nv'+i).value).filter(x=>x).filter((x,i,a)=>a.indexOf(x)===i).join(',');
  o.staticIp=$('#staticIp').checked;o.fanPort=+$('#fanPort').value;o.brightness=+$('#brightness').value;
  o.builtin=BUILTIN.map((b,i)=>$('#bp'+i).checked);
  o.ovTiles=[0,1,2,3,4,5,6,7,8].map(i=>$('#ov'+i).value).join(',').replace(/(,none)+$/,'');
  o.pageNames=[...BUILTIN.map((b,i)=>$('#pn'+i).value.trim()),$('#pn'+BUILTIN.length).value.trim()];
  readLinks();o.links=LINKS.filter(x=>x.n.trim()&&x.u.trim());
  o.poOn=$('#poOn').checked;o.poClear=$('#poClear').checked;o.poPrio=+$('#poPrio').value;
  post('/api/settings',o);
}
// Place search in the browser (Open-Meteo geocoding), fills position and name
async function wxSearch(){
  const q=$('#wxq').value.trim();if(!q)return;
  $('#wxres').innerHTML='<p class="mu">Suche ...</p>';
  try{
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=de&name='+encodeURIComponent(q));
    const j=await r.json();const l=j.results||[];
    if(!l.length){$('#wxres').innerHTML='<p class="mu">Nichts gefunden.</p>';return}
    $('#wxres').innerHTML=l.map((p,i)=>`<span class="chip" data-wx="${i}">${esc(p.name)}${p.admin1?', '+esc(p.admin1):''}${p.country_code?' ('+esc(p.country_code)+')':''}</span>`).join('');
    document.querySelectorAll('[data-wx]').forEach(c=>c.onclick=()=>{const p=l[+c.dataset.wx];
      $('#wxLat').value=p.latitude.toFixed(4);$('#wxLon').value=p.longitude.toFixed(4);$('#wxName').value=p.name;$('#wxOn').checked=true;
      $('#wxres').innerHTML='<p class="mu">Übernommen – bitte speichern.</p>'});
  }catch(e){$('#wxres').innerHTML='<p class="mu">Suche geht nur mit Internet am Handy/PC. Breiten- und Längengrad sonst von Hand eintragen.</p>'}
}
async function scan(){
  $('#nets').innerHTML='<p class="mu">Suche ...</p>';
  for(let i=0;i<10;i++){
    const r=await fetch('/api/scan');const j=await r.json();
    if(!j.running&&j.nets.length){
      const seen={};$('#nets').innerHTML=j.nets.sort((a,b)=>b.rssi-a.rssi).filter(n=>n.ssid&&!seen[n.ssid]&&(seen[n.ssid]=1)).map(n=>`<span class="chip" data-ssid="${esc(n.ssid)}">${esc(n.ssid)} (${n.rssi})</span>`).join('');
      document.querySelectorAll('[data-ssid]').forEach(c=>c.onclick=()=>$('#wifiSsid').value=c.dataset.ssid);return;
    }
    await new Promise(r=>setTimeout(r,1500));
  }
  $('#nets').innerHTML='<p class="mu">Keine Netze gefunden</p>';
}
// ---- backup: settings + pages as one JSON file, without secrets
const BK_SECRET=['wifiPass','mqttPass','webPass','apPass','poToken','poUser'];
const BK_READONLY=['fw','mac','poStatus'];
const BK_NET=['wifiSsid','staticIp','ip','gateway','subnet','dns','hostname'];
async function backupExport(){
  try{
    const s=await (await fetch('/api/settings')).json();const p=await (await fetch('/api/pages')).json();let ru=null,sn=null;try{ru=await (await fetch('/api/rules')).json()}catch(e){}try{sn=await (await fetch('/api/sensors')).json()}catch(e){}
    BK_SECRET.concat(BK_READONLY).forEach(k=>delete s[k]);
    const b={type:'camper-display-backup',version:1,fw:ST.fw||'',date:new Date().toISOString(),settings:s,pages:p,rules:ru,sensors:sn};
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(b,null,1)],{type:'application/json'}));
    a.download=`${(s.hostname||'camper-display')}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();
    toast('Sicherung gespeichert');
  }catch(e){toast('Sichern fehlgeschlagen')}
}
async function backupImport(){
  const f=$('#bkfile').files[0];if(!f)return toast('Datei wählen');
  let b;try{b=JSON.parse(await f.text())}catch(e){return toast('Keine gültige Datei')}
  if(!b||b.type!=='camper-display-backup'||!b.settings)return toast('Keine Sicherung des Displays');
  if(!confirm('Einstellungen aus der Sicherung übernehmen?'))return;
  const s=Object.assign({},b.settings);BK_SECRET.concat(BK_READONLY).forEach(k=>delete s[k]);
  if(!$('#bknet').checked)BK_NET.forEach(k=>delete s[k]);
  if(b.pages&&b.pages.pages){if(!await post('/api/pages',b.pages))return}
  if(b.rules&&b.rules.rules){if(!await post('/api/rules',b.rules))return}
  if(b.sensors&&b.sensors.devices){if(!await post('/api/sensors',b.sensors))return}
  if(await post('/api/settings',s))setTimeout(()=>location.reload(),2500);
}
// progress bar of the file upload; the panel shows its own update screen meanwhile
function updProgress(pct,txt){const b=$('#updbox');if(!b)return;b.hidden=pct<0;$('#updbar').style.width=Math.max(0,Math.min(100,pct))+'%';$('#updtxt').textContent=txt||''}
function upload(){
  const f=$('#fw').files[0];if(!f)return toast('Datei wählen');
  if(!confirm('Firmware „'+f.name+'“ einspielen? Das Display startet danach neu.'))return;
  const fd=new FormData();fd.append('firmware',f);
  const x=new XMLHttpRequest();x.open('POST','/update');
  x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded*100/e.total);updProgress(p,p<100?`Übertrage ... ${p} %`:'Wird geschrieben ...')}};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}
    if(j.ok||(x.status===200&&/^OK/.test(x.responseText))){updProgress(100,'Fertig – Display startet neu, die Seite lädt gleich neu ...');setTimeout(()=>location.reload(),12000)}
    else{updProgress(-1);toast(j.msg||'Update fehlgeschlagen')}};
  x.onerror=()=>{updProgress(-1);toast('Upload fehlgeschlagen')};
  updProgress(0,'Übertrage ... 0 %');x.send(fd);
}

// ---- page + tile editor
function renderPages(){
  const pOpts=PG.pages.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('');
  let h='<h4>Seiten</h4>';
  PG.pages.forEach((p,i)=>h+=`<div class="row" style="margin:6px 0"><input type="text" class="grow" data-pn="${i}" value="${esc(p.name)}" style="flex:1"><button class="btn sm" data-pu="${i}">▲</button><button class="btn sm danger" data-pd="${i}">✕</button></div>`);
  h+=`<button class="btn sm" id="addp">+ Seite</button><h4>Kacheln</h4>`;
  if(!PG.pages.length)h+='<p class="mu">Zuerst eine Seite anlegen.</p>';
  PG.tiles.forEach((t,i)=>{
    h+=`<div class="tileed"><div class="row"><b>${esc(t.name||'Kachel')}</b><button class="btn sm" data-tu="${i}">▲</button><button class="btn sm danger" data-td="${i}">✕</button></div>
    <div class="f2"><div><label>Name</label><input type="text" data-t="${i}" data-f="name" value="${esc(t.name)}"></div>
    <div><label>Seite</label><select data-t="${i}" data-f="page">${pOpts}</select></div>
    <div><label>Typ</label><select data-t="${i}" data-f="type">${TYPES.map((n,k)=>`<option value="${k}">${n}</option>`).join('')}</select></div>
    <div><label>Einheit</label><input type="text" data-t="${i}" data-f="unit" value="${esc(t.unit)}"></div></div>
    <label>Status-Topic</label><input type="text" data-t="${i}" data-f="topic" value="${esc(t.topic)}" placeholder="zigbee2mqtt/Gerät">
    <div class="f2"><div><label>JSON-Schlüssel (leer = ganzer Wert)</label><input type="text" data-t="${i}" data-f="key" value="${esc(t.key)}" placeholder="temperature"></div>
    <div><label>Nachkommastellen</label><input type="number" data-t="${i}" data-f="decimals" value="${t.decimals??''}" placeholder="wie empfangen"></div></div>
    ${t.type>0?`<label>Befehls-Topic (leer = Status-Topic + /set)</label><input type="text" data-t="${i}" data-f="cmdTopic" value="${esc(t.cmdTopic)}">
    <div class="f2"><div><label>${t.type==3?'Payload (mit {v})':t.type==2?'Payload':'Payload EIN'}</label><input type="text" data-t="${i}" data-f="payloadOn" value="${esc(t.payloadOn)}"></div>
    ${t.type==1?`<div><label>Payload AUS</label><input type="text" data-t="${i}" data-f="payloadOff" value="${esc(t.payloadOff)}"></div><div><label>Wert für „an“</label><input type="text" data-t="${i}" data-f="stateOn" value="${esc(t.stateOn??'ON')}"></div>`:''}
    ${t.type==3?`<div><label>Min</label><input type="number" data-t="${i}" data-f="min" value="${t.min??0}"></div><div><label>Max</label><input type="number" data-t="${i}" data-f="max" value="${t.max??100}"></div><div><label>Schritt</label><input type="number" data-t="${i}" data-f="step" value="${t.step??1}"></div>`:''}</div>`:''}
    ${t.type===0?`<label>Anzeige umbenennen (optional, z. B. <code>close=Zu, open=Offen</code>)</label><input type="text" data-t="${i}" data-f="valMap" value="${esc(t.valMap||'')}" maxlength="120" placeholder="empfangen=angezeigt, …">`:''}
    ${t.type<2?`<label>Warnung (Status-Kachel, Kopfzeile, Pushover)</label>
    <div class="f2"><div><select data-t="${i}" data-f="warnMode"><option value="0">keine</option><option value="1">wenn Wert unter …</option><option value="2">wenn Wert über …</option><option value="3">wenn Wert gleich …</option></select></div>
    <div>${t.warnMode===3?`<input type="text" data-t="${i}" data-f="warnEq" value="${esc(t.warnEq||'')}" maxlength="32" placeholder="z. B. open">`:`<input type="number" step="any" data-t="${i}" data-f="warnVal" value="${t.warnVal??0}" placeholder="Grenzwert">`}</div>
    <div><label>Warnen, wenn keine Daten seit (min, 0 = aus)</label><input type="number" data-t="${i}" data-f="warnStale" value="${t.warnStale||0}"></div>
    <div><label>Warntext (leer = Name + „zu niedrig/hoch“)</label><input type="text" data-t="${i}" data-f="warnText" value="${esc(t.warnText||'')}" maxlength="40" placeholder="z. B. Landstrom weg"></div></div>`:''}</div>`;
  });
  if(PG.pages.length)h+=`<button class="btn sm" id="addt">+ Kachel</button>`;
  h+=`<div class="actions"><button class="btn pri" id="savep">Seiten speichern</button></div>`;
  $('#pged').innerHTML=h;
  PG.tiles.forEach((t,i)=>{document.querySelector(`[data-t="${i}"][data-f="page"]`).value=t.page||0;document.querySelector(`[data-t="${i}"][data-f="type"]`).value=t.type||0;const w=document.querySelector(`[data-t="${i}"][data-f="warnMode"]`);if(w)w.value=t.warnMode||0});
  document.querySelectorAll('[data-pn]').forEach(e=>e.oninput=()=>PG.pages[+e.dataset.pn].name=e.value);
  document.querySelectorAll('[data-pu]').forEach(e=>e.onclick=()=>movePage(+e.dataset.pu));
  document.querySelectorAll('[data-pd]').forEach(e=>e.onclick=()=>delPage(+e.dataset.pd));
  document.querySelectorAll('[data-tu]').forEach(e=>e.onclick=()=>{const i=+e.dataset.tu;if(i>0){[PG.tiles[i-1],PG.tiles[i]]=[PG.tiles[i],PG.tiles[i-1]];renderPages()}});
  document.querySelectorAll('[data-td]').forEach(e=>e.onclick=()=>{PG.tiles.splice(+e.dataset.td,1);renderPages()});
  document.querySelectorAll('[data-t]').forEach(e=>{e.onchange=e.oninput=()=>{
    const t=PG.tiles[+e.dataset.t],f=e.dataset.f;let v=e.value;
    if(['page','type','warnMode'].includes(f))v=+v;else if(['min','max','step','warnVal'].includes(f))v=parseFloat(v);else if(f==='warnStale')v=parseInt(v)||0;
    else if(f==='decimals')v=v===''?-1:+v;
    t[f]=v;if((f==='type'||f==='warnMode')&&e.type!=='text'&&e.type!=='number')renderPages()}});
  const ap=$('#addp');if(ap)ap.onclick=()=>{PG.pages.push({name:'Seite '+(PG.pages.length+1)});renderPages()};
  const at=$('#addt');if(at)at.onclick=()=>{PG.tiles.push({name:'',page:0,type:0,topic:''});renderPages()};
  $('#savep').onclick=()=>{const o=JSON.parse(JSON.stringify(PG));o.tiles.forEach(t=>{if(t.decimals===-1||t.decimals==='')delete t.decimals});post('/api/pages',o)};
}
function movePage(i){if(i<1)return;[PG.pages[i-1],PG.pages[i]]=[PG.pages[i],PG.pages[i-1]];PG.tiles.forEach(t=>{if(t.page===i)t.page=i-1;else if(t.page===i-1)t.page=i});renderPages()}
function delPage(i){
  const n=PG.tiles.filter(t=>t.page===i).length;if(n&&!confirm(`Seite mit ${n} Kachel(n) löschen?`))return;
  PG.pages.splice(i,1);PG.tiles=PG.tiles.filter(t=>t.page!==i);PG.tiles.forEach(t=>{if(t.page>i)t.page--});renderPages();
}

// ---- topic finder
function renderFinder(){
  const b=$('#fstart');if(!b)return;b.textContent=finder.on?'Stop':'Start';b.classList.toggle('danger',finder.on);
  const keys=Object.keys(finder.l).sort();
  if(!keys.length){$('#flist').innerHTML=finder.on?'<p class="mu">Warte auf Nachrichten ... (retained Werte kommen sofort, andere erst bei der nächsten Änderung)</p>':'';return}
  $('#flist').innerHTML='<table>'+keys.map(k=>{
    let p=finder.l[k],chips='';
    try{const j=JSON.parse(p);if(j&&typeof j==='object'&&!Array.isArray(j))chips=Object.keys(j).map(x=>`<span class="chip" data-ft="${esc(k)}" data-fk="${esc(x)}">+ ${esc(x)}</span>`).join('')}catch(e){}
    if(!chips)chips=`<span class="chip" data-ft="${esc(k)}" data-fk="">+ Kachel</span>`;
    return `<tr><td><b>${esc(k)}</b><br><code>${esc(p)}</code><br>${chips}</td></tr>`}).join('')+'</table>';
  document.querySelectorAll('[data-ft]').forEach(c=>c.onclick=()=>addFromFinder(c.dataset.ft,c.dataset.fk));
}
function addFromFinder(topic,key){
  if(!PG.pages.length)PG.pages.push({name:'Zigbee'});
  const dev=topic.split('/').pop();
  const t={name:key?dev+' '+key:dev,page:PG.pages.length-1,type:0,topic,key};
  const unit={temperature:'°C',humidity:'%',battery:'%',pressure:'hPa',power:'W',energy:'kWh',voltage:'V',current:'A',illuminance:'lx',linkquality:'lqi'}[key];
  if(unit)t.unit=unit;
  if(key==='state'){t.type=1;t.cmdTopic=topic+'/set';t.payloadOn='{"state":"ON"}';t.payloadOff='{"state":"OFF"}';t.stateOn='ON';t.name=dev}
  if(key==='brightness'){t.type=3;t.cmdTopic=topic+'/set';t.payloadOn='{"brightness":{v}}';t.min=0;t.max=254;t.step=1}
  PG.tiles.push(t);renderPages();toast('Kachel hinzugefügt – unter „Seiten & Kacheln“ prüfen und speichern');
}

$('#menu').onclick=()=>{const h=document.querySelector('header');h.classList.toggle('open');$('#menu').textContent=h.classList.contains('open')?'✕':'☰'};
$('#wake').onclick=()=>{send({c:'screen',v:'on'});S.awake=true;$('#wake').hidden=true;$('#sleep').hidden=false};
$('#sleep').onclick=()=>{send({c:'screen',v:'off'});S.awake=false;$('#sleep').hidden=true;$('#wake').hidden=false};
setInterval(()=>{const d=new Date();$('#clock').textContent=d.toTimeString().slice(0,5)},10000);
connect();
