; Camper environments for OpenMQTTGateway (BLE only). Copied into the OpenMQTTGateway checkout by setup.py;
; OpenMQTTGateway reads every *_env.ini in its root, so upstream stays untouched.
;
; Topics: <Base_Topic><Gateway_Name>/BTtoMQTT/<MAC>  ->  camper/OMG/BTtoMQTT/A4C138AEF56D
; WiFi and MQTT are set in the setup portal of the gateway (WiFi "OMG..." after the first start),
; or ahead of time in camper_local_env.ini (see camper_local_env.ini.example, not in git).

[camper-omg]
build_flags =
  '-DZgatewayBT="BT"'
  '-DBase_Topic="camper/"'
  '-DGateway_Name="OMG"'
  '-DGateway_Short_Name="OMG"'
  ; only decoded sensors (thermometers, Ruuvi ...), not every phone and beacon nearby
  '-DPublishOnlySensors=true'
  ; scan every 55 s is enough for thermometers, keeps WiFi and BLE calm
  '-DTimeBtwRead=55555'

; ESP32 DevKit (classic ESP32, e.g. ESP32-WROOM-32)
[env:camper-ble]
platform = ${com.esp32_platform}
platform_packages = ${com.esp32_platform_packages}
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
  ${com-esp32.lib_deps}
  ${libraries.ble}
  ${libraries.decoder}
build_flags =
  ${com-esp32.build_flags}
  ${camper-omg.build_flags}
  ${camper-local.build_flags}
  '-DLED_PIN=2'
  '-DLED_PIN_ON=1'
monitor_speed = 115200

; ESP32-C3 (e.g. ESP32-C3 DevKitM-1 / Super Mini)
[env:camper-ble-c3]
platform = ${com.esp32_platform}
platform_packages = ${com.esp32_platform_packages}
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
lib_deps =
  ${com-esp32.lib_deps}
  ${libraries.ble}
  ${libraries.decoder}
build_flags =
  ${com-esp32.build_flags}
  ${camper-omg.build_flags}
  ${camper-local.build_flags}
  '-DNO_INT_TEMP_READING=true'
monitor_speed = 115200

; filled by camper_local_env.ini if it exists (credentials), empty otherwise
[camper-local]
build_flags =
