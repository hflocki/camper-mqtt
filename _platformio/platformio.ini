; Camper Tanklevel - PlatformIO project
; The sources are shared with the Arduino IDE variant in ../_arduino/camper_tanklevel,
; so there is only one code base to maintain.

[platformio]
src_dir  = ../_arduino/camper_tanklevel
data_dir = ../_arduino/camper_tanklevel/data
default_envs = esp32-c3

[env]
; pioarduino: Arduino core 3.x for ESP32 (the official espressif32 platform only ships core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
; Compresses web/index.html into data/index.html.gz before each build
extra_scripts = pre:gzip_web.py
; WiFi + Bluetooth do not fit into the default 1.2 MB app partition
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4
    ESP32Async/ESPAsyncWebServer @ ^3.7
    ESP32Async/AsyncTCP @ ^3.4
    h2zero/NimBLE-Arduino @ ^2.3

; ESP32-C3 Super Mini (USB-C, native USB serial)
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Same board, upload over WiFi (OTA)
[env:esp32-c3-ota]
extends = env:esp32-c3
upload_protocol = espota
upload_port = camper-tanklevel.local
upload_flags =
    --auth=tanklevel1234   ; must match DEFAULT_OTA_PASSWORD in config.h
