; Camper Temp - PlatformIO project
; The sources are shared with the Arduino IDE variant in ../_arduino/camper_temp,
; so there is only one code base to maintain.

[platformio]
src_dir  = ../_arduino/camper_temp
data_dir = ../_arduino/camper_temp/data
default_envs = esp8266

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Compresses web/index.html into data/index.html.gz before each build
extra_scripts = pre:gzip_web.py
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4
    ESP32Async/ESPAsyncWebServer @ ^3.7
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0

; ESP8266 ESP-12E (NodeMCU, Wemos D1 mini ...), 4 MB flash: 1 MB LittleFS, rest firmware + OTA
[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.ldscript = eagle.flash.4m1m.ld
monitor_filters = esp8266_exception_decoder
lib_deps =
    ${env.lib_deps}
    ESP32Async/ESPAsyncTCP @ ^2.0

; Same board, upload over WiFi (OTA)
[env:esp8266-ota]
extends = env:esp8266
upload_protocol = espota
upload_port = camper-temp.local
upload_flags =
    --auth=camptemp1234   ; must match DEFAULT_OTA_PASSWORD in config.h

; ESP32-C3 Super Mini (USB-C, native USB serial). DS18B20 also on GPIO4.
[env:esp32-c3]
; pioarduino: Arduino core 3.x for ESP32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    ESP32Async/AsyncTCP @ ^3.4
