<!DOCTYPE html>
<html lang="de">
<head>
<script>
// camper-display: wall panel; the web page mirrors it over a WebSocket (t: cfg / v / f / err)
const M = {
  id: 'display',
  wsInterval: 2000,
  config: {
    hostname: 'camper-display', displayName: 'Camper', apPass: '********', webUser: '', webPass: '',
    wifiSsid: 'Camper-WLAN', wifiPass: '********', staticIp: false, ip: '', gateway: '', subnet: '', dns: '',
    mqttHost: '192.168.1.1', mqttPort: 1883, mqttUser: '', mqttPass: '',
    prefixSelf: 'camper/display', prefixTank: 'camper/tanklevel', prefixLevel: 'camper/level', prefixHeater: 'camper/heater',
    prefixFan: 'camper/maxxfan', prefixTemp: 'camper/temp', prefixBattery: 'camper/battery', fanPort: 1,
    ntpServer: 'pool.ntp.org', tz: 'CET-1CEST,M3.5.0,M10.5.0/3',
    poOn: true, poClear: true, poPrio: 0, poToken: '********', poUser: '********', poTitle: 'Camper', poStatus: 'OK 14:02',
    brightness: 80, dimBrightness: 10, screenTimeout: 120, warnWake: false,
    wxOn: true, wxLat: '47.6600', wxLon: '9.1750', wxName: 'Stellplatz am See', wxTopic: '', wxGust: 60, wxEvery: 30, ovTempSel: '', ovBatSel: '',
    builtin: [true, true, true, true, true, true, true],
    pageNames: ['Home', 'Truma', 'MaxxFan', 'Level', 'Temperatur', 'Batterie', 'Wetter', 'System'],
    ovTiles: 'water,gas,heater,level,fan,weather,temp,bat1,status',
    fw: '2.0.0', mac: '24:0A:C4:00:00:01',
    // In the mockup the device links open the other mockups
    links: [{n: 'Truma', u: 'heater.html'}, {n: 'MaxxFan', u: 'maxxfan.html'}, {n: 'Tanks', u: 'tanklevel.html'},
            {n: 'Level', u: 'level.html'}, {n: 'Temperatur', u: 'temp.html'}, {n: 'Batterie', u: 'battery.html'}]
  },
  pages: {pages: [{name: 'Licht'}],
          tiles: [{name: 'Licht innen', page: 0, type: 1, topic: 'zigbee2mqtt/licht', key: 'state', cmdTopic: 'zigbee2mqtt/licht/set', payloadOn: 'ON', payloadOff: 'OFF'},
                  {name: 'Helligkeit', page: 0, type: 3, topic: 'zigbee2mqtt/licht', key: 'brightness', cmdTopic: 'zigbee2mqtt/licht/set', min: 0, max: 254, step: 1},
                  {name: 'Landstrom', page: 0, type: 0, topic: 'zigbee2mqtt/steckdose', key: 'power', unit: 'W', decimals: 0}]},
  H: {hvac: 'heat', set: 21, fan: 'eco', wmode: 'eco', room: 18.6, decoke: false, drem: 0},
  T: {t0: 'ON', t1: '180', t2: '0'},
  awake: true, bri: 80, finderOn: false,
  cfgMsg() {
    const c = M.cfg;
    return {t: 'cfg', fw: c.fw, host: c.hostname, name: c.displayName, links: c.links, ap: false, setup: false,
            builtin: c.builtin, ovTiles: c.ovTiles, ovTempSel: c.ovTempSel, ovBatSel: c.ovBatSel, pageNames: c.pageNames, pages: M.pages.pages.map(p => p.name),
            tiles: M.pages.tiles.map(t => Object.assign({n: t.name, p: t.page, y: t.type, u: t.unit || ''},
              t.type === 1 ? {son: t.stateOn || 'ON'} : {}, t.type === 3 ? {min: t.min, max: t.max, step: t.step} : {}))};
  },
  wxMsg() {
    const c = M.cfg, now = Math.floor(Date.now() / 1000);
    if (!c.wxOn) return {t: 'wx', w: {on: false, status: 'Wetter aus', name: c.wxName, warn: ''}};
    const g = 41, warn = c.wxGust > 0 && g >= c.wxGust ? 'Wind: Böen bis ' + g + ' km/h' : '';
    return {t: 'wx', w: {on: true, status: 'Stand ' + new Date().toTimeString().slice(0, 5), name: c.wxName, warn,
      t: 13.2, f: 11.4, h: 71, w: 24, g, dir: 'W', c: 2, day: true, txt: 'Teils bewölkt', rn: 0.2, pn: 35, at: now,
      d: [{c: 2, hi: 14, lo: 7, r: 0.8, p: 40, g: 45}, {c: 63, hi: 12, lo: 6, r: 6.4, p: 90, g: 52},
          {c: 3, hi: 11, lo: 5, r: 1.2, p: 45, g: 38}, {c: 0, hi: 15, lo: 4, r: 0, p: 5, g: 20}]}};
  },
  wsOpen(emit) { emit(M.cfgMsg()); emit(M.wxMsg()); M.emit = emit; },
  state() {
    const t = (Date.now() - M.t0) / 1000, H = M.H;
    if (H.hvac === 'heat' && H.room < H.set) H.room = Math.min(H.set, H.room + 0.05);
    else if (H.hvac !== 'heat') H.room = Math.max(14, H.room - 0.02);
    if (H.decoke) { H.drem = Math.max(0, H.drem - 1 / 30); if (!H.drem) H.decoke = false; }
    const pitch = 1.2 * Math.cos(t / 25), roll = -0.7 * Math.sin(t / 18);
    const charging = Math.floor(t / 120) % 2 === 0;
    const d = {
      tank_status: 'online', water_pct: (68 - t / 60).toFixed(0), water_l: (68 - t / 60).toFixed(1), grey_pct: '', grey_l: '',
      gas_pct: '57', gas_l: '6.3', gas_bat: '88',
      lvl_status: 'online', lvl_pitch: pitch.toFixed(2), lvl_roll: roll.toFixed(2),
      lvl_ok: Math.abs(pitch) <= 0.5 && Math.abs(roll) <= 0.5 ? 'ON' : 'OFF', lvl_tol: '0.5',
      lvl_fl: Math.max(0, -pitch * 3 - roll * 1.4).toFixed(1), lvl_fr: Math.max(0, -pitch * 3 + roll * 1.4).toFixed(1),
      lvl_rl: Math.max(0, pitch * 3 - roll * 1.4).toFixed(1), lvl_rr: Math.max(0, pitch * 3 + roll * 1.4).toFixed(1),
      heat_status: 'online', heat_alive: 'ON', heat_room: H.room.toFixed(1), heat_set: String(H.set), heat_hvac: H.hvac,
      heat_action: H.hvac === 'heat' && H.room < H.set ? 'heating' : 'idle', heat_fan: H.fan, heat_wmode: H.wmode,
      heat_water: H.wmode === 'off' ? '18' : '42', heat_op: H.hvac === 'heat' ? 'Heizen' : 'Aus', heat_err: '0', heat_errflag: 'OFF',
      heat_decoke: H.decoke ? 'ON' : 'OFF', heat_drem: String(Math.ceil(H.drem)),
      fan_status: 'online', fan_hold: 'OFF', fan_led: 'ON',
      temp_status: 'online',
      temp_list: JSON.stringify([{id: 'temp1', name: 'Kühlschrank', t: 5.1 + Math.sin(t / 40) * 0.4, alarm: 0},
                                 {id: 'temp2', name: 'Gefrierfach', t: -17.9, alarm: 0},
                                 {id: 'temp3', name: 'Innenraum', t: H.room - 0.4, alarm: 0}]),
      temp_alarm: '',
      bat_status: 'online',
      bat_list: JSON.stringify([
        {name: 'Aufbau', ok: true, soc: 74, v: 13.3, w: charging ? 90 : -45, rt: charging ? null : 1960, st: '', p: false},
        {name: 'Starter', ok: true, soc: 82, v: 12.6, w: null, rt: null, st: 'Normal', p: false}]),
      t0: M.T.t0, t1: M.T.t1, t2: (charging ? 0 : 1650 + Math.round(Math.sin(t / 5) * 40)).toString()
    };
    return {t: 'v', d, s: {wifi: true, rssi: -52, mqtt: true, ip: '192.168.1.17', bri: M.bri, finder: M.finderOn, awake: M.awake}};
  },
  wsCmd(o) {
    const H = M.H;
    if (o.c === 'heat') {
      if (o.k === 'hvac_mode') H.hvac = o.v;
      else if (o.k === 'room_setpoint') H.set = +o.v;
      else if (o.k === 'fan_mode') H.fan = o.v;
      else if (o.k === 'water_mode') H.wmode = o.v;
      else if (o.k === 'decoke') { H.decoke = o.v === 'ON'; H.drem = H.decoke ? 30 : 0; }
    } else if (o.c === 'tile') {
      if (o.i === 0 && o.v === 'toggle') M.T.t0 = M.T.t0 === 'ON' ? 'OFF' : 'ON';
      else if (o.i === 1) M.T.t1 = String(o.v);
    } else if (o.c === 'bri') M.bri = +o.v;
    else if (o.c === 'screen') M.awake = o.v !== 'off';
    else if (o.c === 'finder') {
      M.finderOn = !!o.on;
      return {t: 'f', on: M.finderOn, filter: o.f || '', l: M.finderOn ? [
        ['zigbee2mqtt/licht', '{"state":"' + M.T.t0 + '","brightness":' + M.T.t1 + '}'],
        ['zigbee2mqtt/tuer', '{"contact":true,"battery":97}'],
        ['zigbee2mqtt/steckdose', '{"power":0,"energy":12.4}']] : []};
    }
    return null;
  },
  route(path, method, body) {
    if (path === '/api/settings' && method === 'GET') return M.cfg;
    if (path === '/api/settings') {
      const b = Object.assign({}, body);
      for (const k of Object.keys(b)) if (/pass|token|user/i.test(k) && k !== 'webUser' && k !== 'mqttUser') delete b[k];
      M.save(b);
      if (M.emit) setTimeout(() => { M.emit(M.cfgMsg()); M.emit(M.wxMsg()); }, 300);
      return {ok: true, msg: 'Gespeichert'}; }
    if (path === '/api/pages' && method === 'GET') return M.pages;
    if (path === '/api/pages') { M.pages = body; return {ok: true, msg: 'Seiten gespeichert'}; }
    if (path === '/api/scan') return {running: false, nets: [{ssid: 'Camper-WLAN', rssi: -48}, {ssid: 'Campingplatz-Gast', rssi: -77}]};
    if (path === '/api/pushover/test') { M.save({poStatus: 'OK ' + new Date().toTimeString().slice(0, 5)}); return {ok: true, msg: 'Testnachricht wird gesendet'}; }
    if (path === '/update') return {ok: true, msg: 'Update ok – Neustart (simuliert)'};
    if (path === '/api/reboot' || path === '/api/factory') return {ok: true, msg: 'Neustart (simuliert)'};
  }
};

// Mockup runtime: replaces the device API (fetch, WebSocket, upload) with a simulation.
// The device script before this one defines M = {config, state(), route(), wsCmd(), wsOpen()}.
(function () {
  const KEY = 'mock:' + (M.id || location.pathname);
  // Settings survive the "restart" reload of the page (per browser tab only).
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) {}
  M.cfg = Object.assign({}, M.config, saved);
  M.save = function (patch) {
    Object.assign(M.cfg, patch);
    Object.assign(saved, patch);
    try { sessionStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
  };
  M.t0 = Date.now();
  M.up = () => (M.uptime0 || 93780) + Math.floor((Date.now() - M.t0) / 1000);

  const json = (o, status) => Promise.resolve(new Response(typeof o === 'string' ? o : JSON.stringify(o),
    { status: status || 200, headers: { 'Content-Type': typeof o === 'string' ? 'text/plain' : 'application/json' } }));
  function bodyOf(opt) {
    const b = opt && opt.body;
    if (!b) return {};
    if (typeof b === 'string') {
      try { return JSON.parse(b); } catch (e) { return Object.fromEntries(new URLSearchParams(b)); }
    }
    if (b instanceof URLSearchParams || b instanceof FormData) return Object.fromEntries(b);
    return {};
  }
  window.fetch = function (url, opt) {
    opt = opt || {};
    const u = new URL(url, location.href);
    const method = (opt.method || 'GET').toUpperCase();
    const body = bodyOf(opt);
    const r = M.route ? M.route(u.pathname, method, body, u.searchParams) : undefined;
    if (r !== undefined) return json(r);
    if (u.pathname === '/api/config' && method === 'GET') return json(M.cfg);
    if (u.pathname === '/api/config' && method === 'POST') {
      const p = Object.assign({}, body);
      for (const k of Object.keys(p)) if (/pass|token/i.test(k)) delete p[k];  // never echo secrets
      M.save(p);
      return json({ ok: true });
    }
    return json({ ok: true });
  };

  // WebSocket: pushes M.state() every M.wsInterval ms, M.wsCmd() gets what the page sends
  class FakeWS {
    constructor() {
      this.readyState = 0;
      setTimeout(() => {
        this.readyState = 1;
        if (this.onopen) this.onopen({});
        if (M.wsOpen) M.wsOpen((o) => this._emit(o));
        this._tick();
      }, 120);
      this._timer = setInterval(() => this._tick(), M.wsInterval || 1000);
    }
    _emit(o) { if (this.onmessage) this.onmessage({ data: JSON.stringify(o) }); }
    _tick() { if (M.state) this._emit(M.state()); }
    send(d) {
      let o = d;
      try { o = JSON.parse(d); } catch (e) {}
      const reply = M.wsCmd ? M.wsCmd(o) : null;
      if (reply) this._emit(reply);
      setTimeout(() => this._tick(), 150);
    }
    close() { clearInterval(this._timer); this.readyState = 3; }
    addEventListener(ev, fn) { this['on' + ev] = fn; }
  }
  FakeWS.CONNECTING = 0; FakeWS.OPEN = 1; FakeWS.CLOSING = 2; FakeWS.CLOSED = 3;
  window.WebSocket = FakeWS;

  // File upload: simulated progress, answers like the firmware ("OK" or "OK web" for a .gz page)
  class FakeXHR {
    constructor() { this.upload = {}; this.status = 0; this.responseText = ''; }
    open(m, u) { this._u = u; }
    setRequestHeader() {}
    send(fd) {
      let name = '';
      try { for (const v of fd.values()) if (v && v.name) name = v.name; } catch (e) {}
      let p = 0;
      const iv = setInterval(() => {
        p += 25;
        if (this.upload.onprogress) this.upload.onprogress({ lengthComputable: true, loaded: p, total: 100 });
        if (p >= 100) {
          clearInterval(iv);
          this.status = 200;
          this.responseText = /\.gz$/i.test(name) ? 'OK web' : 'OK';
          if (this.onload) this.onload();
        }
      }, 250);
    }
  }
  window.XMLHttpRequest = FakeXHR;

  // Dialogs are blocked in some embedded viewers; the mockup always answers "yes"
  window.confirm = () => true;
  window.alert = (m) => console.log('[alert]', m);

  // Banner
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.createElement('div');
    b.textContent = 'Mockup mit Beispieldaten – keine Verbindung zu einem Gerät';
    b.style.cssText = 'position:sticky;top:0;z-index:9999;background:#d4a017;color:#000;text-align:center;font:600 12px system-ui;padding:4px';
    document.body.prepend(b);
  });
})();

</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Camper Display</title>
<style>
:root{--bg:#0f1419;--card:#1b232b;--hi:#26313b;--tx:#e8edf2;--mu:#8696a6;--water:#3ba3e8;--grey:#a88b6a;--gas:#f0a030;--heat:#f06a3b;--ok:#4cc27a;--warn:#e5484d;--ac:#5ab0f0}
@media (prefers-color-scheme:light){:root{--bg:#eef1f4;--card:#fff;--hi:#e3e8ee;--tx:#14202b;--mu:#5d6d7c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--card);padding:10px 14px 0;box-shadow:0 1px 0 #0003}
.top{display:flex;align-items:center;gap:10px;position:relative}
.top h1{font-size:18px;margin:0;flex:1}
#clock{font-variant-numeric:tabular-nums;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);display:inline-block}
.dot.ok{background:var(--ok)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--hi);color:var(--tx);font:inherit;font-size:15px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{padding:14px;max-width:820px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border-radius:16px;padding:14px;position:relative}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 6px;font-size:14px;font-weight:500;color:var(--mu)}
.big{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.huge{font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.mu{color:var(--mu);font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--hi);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;transition:width .4s}
.click{cursor:pointer}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .grow{flex:1}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--hi);color:var(--tx);font:inherit;cursor:pointer;min-width:52px}
.btn:active{filter:brightness(1.25)}
.btn.on{background:var(--heat);color:#fff}
.btn.pri{background:var(--ac);color:#fff}
.btn.danger{background:var(--warn);color:#fff}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:9px}
.seg{display:inline-flex;gap:6px}
.seg .btn.on{background:var(--heat)}
.offline{opacity:.45}
input[type=range]{width:100%;accent-color:var(--ac)}
.err{color:var(--warn)}
.okc{color:var(--ok)}
.fanbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fanbtns .btn{padding:18px}
svg text{fill:var(--tx);font:13px system-ui}
/* settings */
details{background:var(--card);border-radius:14px;margin-bottom:12px;padding:0 14px}
summary{cursor:pointer;padding:14px 0;font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--hi);background:var(--bg);color:var(--tx);font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--tx);font-size:15px}
.chk input{width:20px;height:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0}
.tileed{border:1px solid var(--hi);border-radius:12px;padding:10px;margin:10px 0}
.tileed .row b{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 4px;border-top:1px solid var(--hi);vertical-align:top;word-break:break-all}
code{font-size:12px;color:var(--mu)}
.chip{display:inline-block;margin:2px;padding:3px 8px;border-radius:8px;background:var(--hi);cursor:pointer;font-size:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.banner{background:var(--gas);color:#000;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.warnbox{background:var(--warn);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:600;white-space:pre-line}
.trow{display:flex;align-items:center;gap:10px}
.trow .n{flex:1;color:var(--mu);font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.al .big{color:var(--warn)}
</style>

<body>
<header>
  <div class="top"><span class="dot" id="dot" title="Verbindung"></span><h1 id="title">Camper</h1><span class="mu" id="dname" style="position:absolute;left:50%;transform:translateX(-50%);font-weight:600;pointer-events:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="btn" id="wake" hidden title="Display ist dunkel" style="padding:6px 12px;font-size:14px">💡 Display an</button><button class="btn" id="sleep" hidden title="Display ausschalten" style="padding:6px 10px;font-size:14px">💤</button><span id="clock"></span></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ws,cfg=null,V={},S={},WX={},page=localStorage.getItem('page')||'',finder={on:false,l:{}};
let pendingSet=null,setTimer=null,setHold=0;
const BUILTIN=[['overview','Home'],['heater','Truma'],['fan','MaxxFan'],['level','Level'],['temp','Temperatur'],['bat','Batterie'],['weather','Wetter']];
// page title: name from the display settings, otherwise the default above
const ptitle=i=>(cfg&&cfg.pageNames&&cfg.pageNames[i])||BUILTIN[i][1];
// overview tiles (same list as on the panel)
const OV_DEFAULT='water,grey,gas,heater,level,fan,temp,bat,status';
const ovList=()=>((cfg&&cfg.ovTiles)||OV_DEFAULT).split(',').map(x=>x.trim()).filter(x=>x);
function ovChoices(){
  const c=[['water','Frischwasser'],['grey','Grauwasser'],['gas','Gas'],['heater',ptitle(1)],['level',ptitle(3)],['fan',ptitle(2)],
    ['temp',ptitle(4)],['bat',ptitle(5)+' (alle)'],['bat1','Batterie 1 (einzeln)'],['bat2','Batterie 2 (einzeln)'],['bat3','Batterie 3 (einzeln)'],
    ['status','Status / Warnungen'],['weather',ptitle(6)],['clock','Uhr / Datum'],['none','(leer)']];
  ((cfg&&cfg.tiles)||[]).forEach((t,i)=>c.push(['t'+i,'Kachel: '+t.n]));
  return c;
}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function send(o){if(ws&&ws.readyState==1)ws.send(JSON.stringify(o));else toast('Keine Verbindung')}
function num(v,d){if(v===undefined||v==='')return null;const f=parseFloat(v);return isNaN(f)?null:(d===undefined?f:f.toFixed(d))}
function fmt(v,d,u){const n=num(v,d);if(n===null)return(v&&v!=='')?esc(v)+(u?' '+u:''):'--';return n+(u?' '+u:'')}
function online(dev){return V[dev+'_status']==='online'}

// ---------- connection ----------
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>$('#dot').classList.add('ok');
  ws.onclose=()=>{$('#dot').classList.remove('ok');setTimeout(connect,2000)};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='cfg'){cfg=m;buildNav();if(!pages().some(p=>p.id===page))page=cfg.setup?'settings':pages()[0].id;render()}
    else if(m.t==='v'){Object.assign(V,m.d||{});if(m.s)Object.assign(S,m.s);update()}
    else if(m.t==='f'){if(!m.add)finder.l={};if('on' in m)finder.on=!!m.on;else finder.on=true;finder.filter=m.filter;(m.l||[]).forEach(x=>finder.l[x[0]]=x[1]);renderFinder()}
    else if(m.t==='err')toast(m.msg);
    else if(m.t==='wx'){WX=m.w||{};update()}
  };
}

// ---------- pages ----------
function pages(){
  const p=[];if(!cfg)return p;
  BUILTIN.forEach((b,i)=>{if(cfg.builtin[i])p.push({id:b[0],title:ptitle(i)})});
  cfg.pages.forEach((n,i)=>p.push({id:'p'+i,title:n,custom:i}));
  p.push({id:'links',title:'🔗 Geräte'});
  p.push({id:'settings',title:'⚙ Einstellungen'});
  return p;
}
function buildNav(){
  $('#nav').innerHTML=pages().map(p=>`<button data-p="${p.id}">${esc(p.title)}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.p;localStorage.setItem('page',page);render()});
}
function render(){
  $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
  const p=pages().find(x=>x.id===page);if(!p)return;
  $('#title').textContent=p.title.replace('⚙ ','');
  $('#dname').textContent=cfg.name||'';document.title=cfg.name?cfg.name+' · Camper Display':'Camper Display';
  const m=$('#main');
  if(p.id==='overview')m.innerHTML=pgOverview();
  else if(p.id==='heater')m.innerHTML=pgHeater();
  else if(p.id==='fan')m.innerHTML=pgFan();
  else if(p.id==='level')m.innerHTML=pgLevel();
  else if(p.id==='temp')m.innerHTML=pgTemp();
  else if(p.id==='bat')m.innerHTML=pgBat();
  else if(p.id==='weather')m.innerHTML=pgWeather();
  else if(p.id==='links')m.innerHTML=pgLinks();
  else if(p.id==='settings'){m.innerHTML=pgSettings();loadSettings()}
  else m.innerHTML=pgCustom(p.custom);
  bind();update();
}

const ICONS=[['bat','🔋','Batterie'],['carbat','🚙','Starterbatterie'],['home','🏠','Wohnraum / Aufbau'],['sun','☀️','Sonne'],['solar','🔆','Solarpanel'],['car','🚗','Fahrzeug'],['plug','🔌','Landstrom'],['bolt','⚡','Strom'],['therm','🌡️','Thermometer'],['fridge','🧊','Kühlschrank'],['snow','❄️','Gefrierfach'],['couch','🛋️','Innenraum'],['tree','🌳','Außen'],['bed','🛏️','Schlafen'],['water','💧','Wasser'],['fire','🔥','Heizung'],['shower','🚿','Bad'],['box','📦','Stauraum']];

function autoIco(n,temp){n=(n||'').toLowerCase();const h=(...k)=>k.some(x=>n.includes(x));
  if(temp)return h('gefrier','tiefk','frost','freez')?'snow':h('kühl','kuehl','fridge')?'fridge':h('außen','aussen','draußen','outdoor','outside')?'tree':h('bad','dusch','wc')?'shower':h('schlaf','bett','alkoven')?'bed':h('wasser','boiler','tank')?'water':h('heiz','truma')?'fire':h('garage','stau','keller')?'box':h('innen','wohn','raum','inside')?'couch':h('motor','fahrer','cockpit')?'car':'therm';
  return h('solar','pv')?'sun':h('start','motor','fahrzeug','kfz','auto','lkw')?'car':h('land','230')?'plug':h('aufbau','wohn','bord','versorg','house','service')?'home':'bat'}
function icoKey(n,temp){const sl=slotsOf(cfg&&(temp?cfg.ovTempSel:cfg.ovBatSel)).find(x=>x.n===n);return sl&&ICONS.some(x=>x[0]===sl.k)?sl.k:autoIco(n,temp)}

    LINKS=(ST.links||[]).map(x=>({n:x.n,u:x.u}));renderLinks();

  }catch(e){toast('Einstellungen konnten nicht geladen werden')}
  $('#save').onclick=saveSettings;

  $('#lnksug').onclick=()=>{readLinks();SUGGEST.forEach(([n,h])=>{if(!LINKS.some(x=>x.u.includes(h)||x.n.toLowerCase()===n.toLowerCase()))LINKS.push({n,u:'http://'+h+'.local/'})});renderLinks()};
  $('#brightness').oninput=e=>send({c:'bri',v:e.target.value});

  $('#fstart').onclick=()=>send({c:'finder',on:!finder.on,f:$('#ffilter').value});

async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):'{}'});
  let j={};try{j=await r.json()}catch(e){}
  toast(j.msg||(r.ok?'OK':'Fehler'));
  if(j.reboot)setTimeout(()=>location.reload(),8000);
  return r.ok;
}

function renderLinks(){
  const b=$('#lnk');if(!b)return;
  b.innerHTML=LINKS.map((x,i)=>`<div class="row" style="gap:6px;margin:4px 0"><input type="text" data-ln="${i}" value="${esc(x.n)}" placeholder="Name" maxlength="24" style="flex:1;min-width:0"><input type="text" data-lu="${i}" value="${esc(x.u)}" placeholder="http://192.168.8.13/" maxlength="120" style="flex:2;min-width:0"><button class="btn" type="button" data-ld="${i}" title="Entfernen">✕</button></div>`).join('')||'<p class="mu">Noch keine Links.</p>';
  b.querySelectorAll('[data-ld]').forEach(e=>e.onclick=()=>{readLinks();LINKS.splice(+e.dataset.ld,1);renderLinks()});
}
function readLinks(){
  document.querySelectorAll('[data-ln]').forEach(e=>{const i=+e.dataset.ln;if(LINKS[i])LINKS[i].n=e.value.trim()});
  document.querySelectorAll('[data-lu]').forEach(e=>{const i=+e.dataset.lu;if(LINKS[i])LINKS[i].u=e.value.trim()});

// three rows per tile: sensor/battery + icon; names from the live data and the saved choice
function renderSlots(){
  [['slt',true],['slb',false]].forEach(([id,temp])=>{
    const box=$('#'+id);if(!box)return;
    let cur=slotsOf(ST&&(temp?ST.ovTempSel:ST.ovBatSel));
    if(box.querySelector('[data-sn]'))cur=[0,1,2].map(i=>({n:box.querySelector(`[data-sn="${i}"]`).value,k:box.querySelector(`[data-sk="${i}"]`).value}));
    const names=[...new Set([...(temp?temps():bats()).map(x=>x.name),...cur.map(x=>x.n)].filter(x=>x))];
    box.innerHTML=[0,1,2].map(i=>{const c=cur[i]||{n:'',k:''};
      return `<div class="row" style="gap:8px;margin:4px 0;flex-wrap:nowrap"><select data-sn="${i}" style="flex:1;min-width:0"><option value="">– leer –</option>${names.map(n=>`<option value="${esc(n)}"${n===c.n?' selected':''}>${esc(n)}</option>`).join('')}</select><select data-sk="${i}" style="flex:1;min-width:0"><option value="">Symbol automatisch</option>${ICONS.map(x=>`<option value="${x[0]}"${x[0]===c.k?' selected':''}>${x[1]} ${x[2]}</option>`).join('')}</select></div>`}).join('');
  });

function readSlots(id){const b=$('#'+id);if(!b)return'';const l=[];for(let i=0;i<3;i++){const n=b.querySelector(`[data-sn="${i}"]`).value;if(n)l.push(n+'='+b.querySelector(`[data-sk="${i}"]`).value)}return l.join('\n')}

  ['mqttPort','dimBrightness','screenTimeout','wxGust'].forEach(f=>o[f]=parseInt(o[f])||0);
  o.warnWake=$('#warnWake').checked;o.wxOn=$('#wxOn').checked;o.wxEvery=+$('#wxEvery').value;
  o.ovTempSel=readSlots('slt');o.ovBatSel=readSlots('slb');
  o.staticIp=$('#staticIp').checked;o.fanPort=+$('#fanPort').value;o.brightness=+$('#brightness').value;
  o.builtin=BUILTIN.map((b,i)=>$('#bp'+i).checked);
  o.ovTiles=[0,1,2,3,4,5,6,7,8].map(i=>$('#ov'+i).value).join(',').replace(/(,none)+$/,'');
  o.pageNames=[...BUILTIN.map((b,i)=>$('#pn'+i).value.trim()),$('#pn'+BUILTIN.length).value.trim()];
  readLinks();o.links=LINKS.filter(x=>x.n.trim()&&x.u.trim());
  o.poOn=$('#poOn').checked;o.poClear=$('#poClear').checked;o.poPrio=+$('#poPrio').value;
  post('/api/settings',o);
}
// Place search in the browser (Open-Meteo geocoding), fills position and name
async function wxSearch(){
  const q=$('#wxq').value.trim();if(!q)return;
  $('#wxres').innerHTML='<p class="mu">Suche ...</p>';
  try{
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=de&name='+encodeURIComponent(q));
    const j=await r.json();const l=j.results||[];
    if(!l.length){$('#wxres').innerHTML='<p class="mu">Nichts gefunden.</p>';return}
    $('#wxres').innerHTML=l.map((p,i)=>`<span class="chip" data-wx="${i}">${esc(p.name)}${p.admin1?', '+esc(p.admin1):''}${p.country_code?' ('+esc(p.country_code)+')':''}</span>`).join('');
    document.querySelectorAll('[data-wx]').forEach(c=>c.onclick=()=>{const p=l[+c.dataset.wx];
      $('#wxLat').value=p.latitude.toFixed(4);$('#wxLon').value=p.longitude.toFixed(4);$('#wxName').value=p.name;$('#wxOn').checked=true;
      $('#wxres').innerHTML='<p class="mu">Übernommen – bitte speichern.</p>'});
  }catch(e){$('#wxres').innerHTML='<p class="mu">Suche geht nur mit Internet am Handy/PC. Breiten- und Längengrad sonst von Hand eintragen.</p>'}
}
async function scan(){
  $('#nets').innerHTML='<p class="mu">Suche ...</p>';
  for(let i=0;i<10;i++){
    const r=await fetch('/api/scan');const j=await r.json();
    if(!j.running&&j.nets.length){
      const seen={};$('#nets').innerHTML=j.nets.sort((a,b)=>b.rssi-a.rssi).filter(n=>n.ssid&&!seen[n.ssid]&&(seen[n.ssid]=1)).map(n=>`<span class="chip" data-ssid="${esc(n.ssid)}">${esc(n.ssid)} (${n.rssi})</span>`).join('');
      document.querySelectorAll('[data-ssid]').forEach(c=>c.onclick=()=>$('#wifiSsid').value=c.dataset.ssid);return;
    }
    await new Promise(r=>setTimeout(r,1500));
  }
  $('#nets').innerHTML='<p class="mu">Keine Netze gefunden</p>';
}
function upload(){
  const f=$('#fw').files[0];if(!f)return toast('Datei wählen');
  const fd=new FormData();fd.append('firmware',f);toast('Lade hoch ...');
  fetch('/update',{method:'POST',body:fd}).then(r=>r.json()).then(j=>{toast(j.msg);if(j.ok)setTimeout(()=>location.reload(),10000)}).catch(()=>toast('Upload fehlgeschlagen'));
}

// ---- page + tile editor
function renderPages(){
  const pOpts=PG.pages.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('');
  let h='<h4>Seiten</h4>';
  PG.pages.forEach((p,i)=>h+=`<div class="row" style="margin:6px 0"><input type="text" class="grow" data-pn="${i}" value="${esc(p.name)}" style="flex:1"><button class="btn sm" data-pu="${i}">▲</button><button class="btn sm danger" data-pd="${i}">✕</button></div>`);
  h+=`<button class="btn sm" id="addp">+ Seite</button><h4>Kacheln</h4>`;
  if(!PG.pages.length)h+='<p class="mu">Zuerst eine Seite anlegen.</p>';
  PG.tiles.forEach((t,i)=>{
    h+=`<div class="tileed"><div class="row"><b>${esc(t.name||'Kachel')}</b><button class="btn sm" data-tu="${i}">▲</button><button class="btn sm danger" data-td="${i}">✕</button></div>
    <div class="f2"><div><label>Name</label><input type="text" data-t="${i}" data-f="name" value="${esc(t.name)}"></div>
    <div><label>Seite</label><select data-t="${i}" data-f="page">${pOpts}</select></div>
    <div><label>Typ</label><select data-t="${i}" data-f="type">${TYPES.map((n,k)=>`<option value="${k}">${n}</option>`).join('')}</select></div>
    <div><label>Einheit</label><input type="text" data-t="${i}" data-f="unit" value="${esc(t.unit)}"></div></div>
    <label>Status-Topic</label><input type="text" data-t="${i}" data-f="topic" value="${esc(t.topic)}" placeholder="zigbee2mqtt/Gerät">
    <div class="f2"><div><label>JSON-Schlüssel (leer = ganzer Wert)</label><input type="text" data-t="${i}" data-f="key" value="${esc(t.key)}" placeholder="temperature"></div>
    <div><label>Nachkommastellen</label><input type="number" data-t="${i}" data-f="decimals" value="${t.decimals??''}" placeholder="wie empfangen"></div></div>
    ${t.type>0?`<label>Befehls-Topic (leer = Status-Topic + /set)</label><input type="text" data-t="${i}" data-f="cmdTopic" value="${esc(t.cmdTopic)}">
    <div class="f2"><div><label>${t.type==3?'Payload (mit {v})':t.type==2?'Payload':'Payload EIN'}</label><input type="text" data-t="${i}" data-f="payloadOn" value="${esc(t.payloadOn)}"></div>
    ${t.type==1?`<div><label>Payload AUS</label><input type="text" data-t="${i}" data-f="payloadOff" value="${esc(t.payloadOff)}"></div><div><label>Wert für „an“</label><input type="text" data-t="${i}" data-f="stateOn" value="${esc(t.stateOn??'ON')}"></div>`:''}
    ${t.type==3?`<div><label>Min</label><input type="number" data-t="${i}" data-f="min" value="${t.min??0}"></div><div><label>Max</label><input type="number" data-t="${i}" data-f="max" value="${t.max??100}"></div><div><label>Schritt</label><input type="number" data-t="${i}" data-f="step" value="${t.step??1}"></div>`:''}</div>`:''}</div>`;
  });
  if(PG.pages.length)h+=`<button class="btn sm" id="addt">+ Kachel</button>`;
  h+=`<div class="actions"><button class="btn pri" id="savep">Seiten speichern</button></div>`;
  $('#pged').innerHTML=h;
  PG.tiles.forEach((t,i)=>{document.querySelector(`[data-t="${i}"][data-f="page"]`).value=t.page||0;document.querySelector(`[data-t="${i}"][data-f="type"]`).value=t.type||0});
  document.querySelectorAll('[data-pn]').forEach(e=>e.oninput=()=>PG.pages[+e.dataset.pn].name=e.value);
  document.querySelectorAll('[data-pu]').forEach(e=>e.onclick=()=>movePage(+e.dataset.pu));
  document.querySelectorAll('[data-pd]').forEach(e=>e.onclick=()=>delPage(+e.dataset.pd));
  document.querySelectorAll('[data-tu]').forEach(e=>e.onclick=()=>{const i=+e.dataset.tu;if(i>0){[PG.tiles[i-1],PG.tiles[i]]=[PG.tiles[i],PG.tiles[i-1]];renderPages()}});
  document.querySelectorAll('[data-td]').forEach(e=>e.onclick=()=>{PG.tiles.splice(+e.dataset.td,1);renderPages()});
  document.querySelectorAll('[data-t]').forEach(e=>{e.onchange=e.oninput=()=>{
    const t=PG.tiles[+e.dataset.t],f=e.dataset.f;let v=e.value;
    if(['page','type'].includes(f))v=+v;else if(['min','max','step'].includes(f))v=parseFloat(v);
    else if(f==='decimals')v=v===''?-1:+v;
    t[f]=v;if(f==='type'&&e.type!=='text')renderPages()}});
  const ap=$('#addp');if(ap)ap.onclick=()=>{PG.pages.push({name:'Seite '+(PG.pages.length+1)});renderPages()};
  const at=$('#addt');if(at)at.onclick=()=>{PG.tiles.push({name:'',page:0,type:0,topic:''});renderPages()};
  $('#savep').onclick=()=>{const o=JSON.parse(JSON.stringify(PG));o.tiles.forEach(t=>{if(t.decimals===-1||t.decimals==='')delete t.decimals});post('/api/pages',o)};
}
function movePage(i){if(i<1)return;[PG.pages[i-1],PG.pages[i]]=[PG.pages[i],PG.pages[i-1]];PG.tiles.forEach(t=>{if(t.page===i)t.page=i-1;else if(t.page===i-1)t.page=i});renderPages()}
function delPage(i){
  const n=PG.tiles.filter(t=>t.page===i).length;if(n&&!confirm(`Seite mit ${n} Kachel(n) löschen?`))return;
  PG.pages.splice(i,1);PG.tiles=PG.tiles.filter(t=>t.page!==i);PG.tiles.forEach(t=>{if(t.page>i)t.page--});renderPages();
}

// ---- topic finder
function renderFinder(){
  const b=$('#fstart');if(!b)return;b.textContent=finder.on?'Stop':'Start';b.classList.toggle('danger',finder.on);
  const keys=Object.keys(finder.l).sort();
  if(!keys.length){$('#flist').innerHTML=finder.on?'<p class="mu">Warte auf Nachrichten ... (retained Werte kommen sofort, andere erst bei der nächsten Änderung)</p>':'';return}
  $('#flist').innerHTML='<table>'+keys.map(k=>{
    let p=finder.l[k],chips='';
    try{const j=JSON.parse(p);if(j&&typeof j==='object'&&!Array.isArray(j))chips=Object.keys(j).map(x=>`<span class="chip" data-ft="${esc(k)}" data-fk="${esc(x)}">+ ${esc(x)}</span>`).join('')}catch(e){}
    if(!chips)chips=`<span class="chip" data-ft="${esc(k)}" data-fk="">+ Kachel</span>`;
    return `<tr><td><b>${esc(k)}</b><br><code>${esc(p)}</code><br>${chips}</td></tr>`}).join('')+'</table>';
  document.querySelectorAll('[data-ft]').forEach(c=>c.onclick=()=>addFromFinder(c.dataset.ft,c.dataset.fk));
}
function addFromFinder(topic,key){
  if(!PG.pages.length)PG.pages.push({name:'Zigbee'});
  const dev=topic.split('/').pop();
  const t={name:key?dev+' '+key:dev,page:PG.pages.length-1,type:0,topic,key};
  const unit={temperature:'°C',humidity:'%',battery:'%',pressure:'hPa',power:'W',energy:'kWh',voltage:'V',current:'A',illuminance:'lx',linkquality:'lqi'}[key];
  if(unit)t.unit=unit;
  if(key==='state'){t.type=1;t.cmdTopic=topic+'/set';t.payloadOn='{"state":"ON"}';t.payloadOff='{"state":"OFF"}';t.stateOn='ON';t.name=dev}
  if(key==='brightness'){t.type=3;t.cmdTopic=topic+'/set';t.payloadOn='{"brightness":{v}}';t.min=0;t.max=254;t.step=1}
  PG.tiles.push(t);renderPages();toast('Kachel hinzugefügt – unter „Seiten & Kacheln“ prüfen und speichern');
}

$('#wake').onclick=()=>{send({c:'screen',v:'on'});S.awake=true;$('#wake').hidden=true;$('#sleep').hidden=false};
$('#sleep').onclick=()=>{send({c:'screen',v:'off'});S.awake=false;$('#sleep').hidden=true;$('#wake').hidden=false};
setInterval(()=>{const d=new Date();$('#clock').textContent=d.toTimeString().slice(0,5)},10000);
connect();
</script>
